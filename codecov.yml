# Native coverage is published once, after prepare-coverage-upload.py validates
# all seven CI shards. Test analytics uploads do not count as coverage uploads.
codecov:
  branch: master
  max_report_age: 24
  require_ci_to_pass: false
  notify:
    after_n_builds: 1
    wait_for_ci: false
    notify_error: true

coverage:
  precision: 2
  round: down
  range: "50..100"
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: include
    project:
      default:
        target: auto
        threshold: 1%
      application:
        target: 75%
        threshold: 0%
        paths:
          - "src/"
    patch:
      default:
        target: 60%
        threshold: 0%
        only_pulls: true
      security:
        target: 70%
        threshold: 0%
        only_pulls: true
        paths:
          - "lib/crypto/"
          - "include/ascii-chat/crypto/"
          - "src/client/crypto.c"
          - "lib/network/crc32.c"
    changes: false

# Components diagnose modules without duplicating the gates above. Targets follow
# each module's baseline, including hardware and platform backends.
component_management:
  default_rules:
    flag_regexes:
      - "^coverage$"
    statuses:
      - type: project
        target: auto
        threshold: 1%
        informational: true
  individual_components:
    - component_id: server
      name: Server
      paths: ["src/server/"]
    - component_id: client
      name: Client
      paths: ["src/client/"]
    - component_id: session
      name: Shared Sessions
      paths: ["src/common/session/", "src/session/"]
    - component_id: discovery
      name: Discovery
      paths: ["src/discovery/", "src/discovery-service/", "lib/discovery/", "include/ascii-chat/discovery/"]
    - component_id: mcp
      name: MCP Server
      paths: ["src/mcp-server/"]
    - component_id: entry_points
      name: CLI Entry Points
      paths: ["src/main.c", "src/mirror/", "src/strings/"]
    - component_id: video
      name: Video and ASCII Rendering
      paths: ["lib/video/", "include/ascii-chat/video/"]
    - component_id: simd
      name: SIMD Rendering
      paths:
        - "lib/video/ascii/avx2/"
        - "lib/video/ascii/neon/"
        - "lib/video/ascii/scalar/"
        - "lib/video/ascii/simd/"
        - "lib/video/ascii/sse2/"
        - "lib/video/ascii/ssse3/"
        - "lib/video/ascii/sve/"
    - component_id: audio
      name: Audio
      paths: ["lib/audio/", "include/ascii-chat/audio/"]
    - component_id: networking
      name: Networking
      paths: ["lib/network/", "include/ascii-chat/network/"]
    - component_id: crypto
      name: Cryptography
      paths: ["lib/crypto/", "include/ascii-chat/crypto/", "src/client/crypto.c"]
    - component_id: media
      name: Media Sources and Output
      paths: ["lib/media/", "include/ascii-chat/media/"]
    - component_id: terminal
      name: Terminal and UI
      paths:
        - "lib/terminal/"
        - "lib/tui/"
        - "lib/ui/"
        - "include/ascii-chat/terminal/"
        - "include/ascii-chat/tui/"
        - "include/ascii-chat/ui/"
    - component_id: options
      name: Options and Configuration
      paths: ["lib/options/", "include/ascii-chat/options/"]
    - component_id: observability
      name: Logging, Statistics and Debugging
      paths:
        - "lib/log/"
        - "lib/stats/"
        - "lib/debug/"
        - "include/ascii-chat/log/"
        - "include/ascii-chat/stats/"
        - "include/ascii-chat/debug/"
    - component_id: platform
      name: Platform Abstraction
      paths: ["lib/platform/", "include/ascii-chat/platform/"]
    - component_id: utilities
      name: Utilities and Data Structures
      paths: ["lib/*.c", "lib/util/", "include/ascii-chat/*.h", "include/ascii-chat/util/"]
    - component_id: tooling
      name: Native Developer Tools
      paths: ["lib/tooling/", "src/tooling/"]
    - component_id: browser
      name: Browser Runtime
      paths: ["src/web/"]

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  show_carryforward_flags: false

# Generated files, external sources and test code. All product src/ modules stay
# in the denominator, including currently untested paths.
ignore:
  - "build*/**"
  - ".deps-cache/"
  - "deps/"
  - "tests/"
  - "lib/tests/"
  - "include/ascii-chat/tests/"
  - "lib/version.c"
  - "lib/musl_c23_compat.c"

flags:
  coverage:
    paths: ["lib/", "src/", "include/"]
    carryforward: false

# Preserve branch partials; treating them as hits raises the score without
# exercising another branch.
parsers:
  cobertura:
    partials_as_hits: false

github_checks:
  annotations: true
