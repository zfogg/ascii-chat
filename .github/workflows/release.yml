name: Release

# Manual dispatch may reuse an existing immutable tag after workflow-only fixes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Full version (e.g., v2.0.0) - overrides auto-bump"
        required: false
        type: string
      major_bump:
        description: "Force major version bump (requires manual trigger)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: true

env:
  CC: clang
  CXX: clang++

jobs:
  create-release:
    # Only run for tagged builds or manual dispatch
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      library_version: ${{ steps.version.outputs.library_version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for version calculation
          fetch-tags: true # Explicitly fetch tags for version detection
          submodules: false

      - name: Initialize submodules
        run: git submodule update --init --depth 1

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "Using tag-derived version: $VERSION"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            # Use version.sh script to calculate next version
            chmod +x scripts/version.sh

            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v0.0.0")
            echo "Current version: $LAST_TAG"

            # Determine bump type from commits
            COMMITS=$(git log --format=%s $LAST_TAG..HEAD)
            FEAT_COUNT=$(echo "$COMMITS" | grep -icE '^(feat|feature):' || true)
            FIX_COUNT=$(echo "$COMMITS" | grep -icE '^(fix|bugfix):' || true)
            TOTAL_COMMITS=$(echo "$COMMITS" | wc -l)
            OTHER_COUNT=$((TOTAL_COMMITS - FEAT_COUNT - FIX_COUNT))

            echo "Commit analysis:"
            echo "  Features: $FEAT_COUNT"
            echo "  Fixes: $FIX_COUNT"
            echo "  Other: $OTHER_COUNT"
            echo "  Total: $TOTAL_COMMITS"

            # Calculate next version using version.sh
            # Default to patch bumps for conservative versioning
            if [[ "${{ github.event.inputs.major_bump }}" == "true" ]]; then
              VERSION_NUM=$(./scripts/version.sh --next-major)
              BUMP_TYPE="major (manual override)"
            else
              VERSION_NUM=$(./scripts/version.sh --next-patch)
              BUMP_TYPE="patch (${FIX_COUNT} fixes, ${FEAT_COUNT} features, ${OTHER_COUNT} other)"
            fi

            VERSION="v${VERSION_NUM}"
            echo "Bump type: $BUMP_TYPE"
            echo "Next version: $VERSION"
          fi

          LIBRARY_TAG=$(git tag -l 'lib/v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          LIBRARY_VERSION="${LIBRARY_TAG#lib/v}"
          if [[ ! "$LIBRARY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine the library version from lib/v* tags"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "library_version=$LIBRARY_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Find the previous tag (not the current one)
          # When on a tagged commit, git describe returns that tag, so we need HEAD^ to find the previous
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || echo "")

          if [[ -n "$LAST_TAG" ]]; then
            # Get commits by type
            FEATURES=$(git log --format="- %s (%an)" $LAST_TAG..HEAD | grep -iE '^- feat(\(.*\))?:' || echo "")
            FIXES=$(git log --format="- %s (%an)" $LAST_TAG..HEAD | grep -iE '^- (fix|bugfix)(\(.*\))?:' || echo "")
            OTHER=$(git log --format="- %s (%an)" $LAST_TAG..HEAD | grep -ivE '^- (feat|fix|bugfix)(\(.*\))?:' | head -n 50 || echo "")

            # Build changelog with proper heredoc
            {
              echo "## Changes since $LAST_TAG"
              echo ""
              echo "### Features"
              if [[ -n "$FEATURES" ]]; then
                echo "$FEATURES"
              else
                echo "- None"
              fi
              echo ""
              echo "### Bug Fixes"
              if [[ -n "$FIXES" ]]; then
                echo "$FIXES"
              else
                echo "- None"
              fi
              echo ""
              echo "### Other Changes"
              [[ -n "$OTHER" ]] && echo "$OTHER"
            } | {
              # Use printf to safely handle multiline content
              printf 'CHANGELOG<<EOF\n'
              cat
              printf '\nEOF'
            } >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=Initial release of ascii-chat" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        # Only create tag for workflow_dispatch - tag already exists for tag push triggers
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | cut -f1)
          if [[ -n "$EXISTING_TAG" ]]; then
            CHANGED_FILES=$(git diff --name-only "$EXISTING_TAG" "$GITHUB_SHA")
            if ! git merge-base --is-ancestor "$EXISTING_TAG" "$GITHUB_SHA"; then
              echo "::error::Tag $VERSION does not point at an ancestor of the workflow commit."
              exit 1
            fi
            while IFS= read -r changed_file; do
              case "$changed_file" in
                .github/workflows/release.yml|.github/actions/install-deps/action.yml) ;;
                *)
                  echo "::error::Tag $VERSION points to $EXISTING_TAG and the release source contains changes beyond the release workflow and dependency action."
                  exit 1
                  ;;
              esac
            done <<< "$CHANGED_FILES"
            echo "Tag $VERSION points to tested source $EXISTING_TAG; only the release workflow changed, so reusing it."
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Create release tarball
        id: tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ./scripts/create-release-tarball.sh "$VERSION"
          TARBALL="ascii-chat-${VERSION#v}-full.tar.gz"
          SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Created tarball: $TARBALL"
          echo "SHA256: $SHA256"

      - name: Prepare Windows ARM manual artifact
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          version="${version#v}"
          tar -xOzf "${{ steps.tarball.outputs.tarball }}" \
            "ascii-chat-${version}/share/man/man1/ascii-chat.1.in" |
            sed -e "s/@PROJECT_VERSION@/${version}/g" \
                -e "s/@PROJECT_VERSION_DATE@/$(date -u +%Y-%m-%d)/g" \
            > "$RUNNER_TEMP/release-man1"

      - name: Upload Windows ARM manual artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-man1
          path: ${{ runner.temp }}/release-man1
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/__release_created_after_validation__'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ascii-chat ${{ steps.version.outputs.version }}
          body: |
            Video chat in your terminal

            ## Download

            **Two Package Types:**
            - **ascii-chat**: Runtime package (executable + man page + shell completions)
            - **libasciichat**: Development package (libraries + headers + API docs + build integration)

            **Linux Installers (x86_64 & arm64):**
            - Runtime: `ascii-chat-*.deb` or `ascii-chat-*.rpm`
            - .deb: `ascii-chat-*.deb`, `libasciichat-dev-*.deb`
            - .rpm: `ascii-chat-*.rpm`,`libasciichat-devel-*.rpm`
            - Archives: `ascii-chat-*.tar.gz`, `libasciichat-*.tar.gz`
            - Self-extracting: `ascii-chat-*.sh`, `libasciichat-*.sh`

            **macOS Installers (x86_64 & arm64):**
            - Runtime: `ascii-chat-*.pkg`
            - Development: `libasciichat-*.pkg`
            - Archives: `ascii-chat-*.tar.gz`, `libasciichat-*.tar.gz`
            - Self-extracting: `ascii-chat-*.sh`, `libasciichat-*.sh`

            **Windows Installers (x86_64):**
            - Installer: `ascii-chat-*.msi` (single installer with optional components)
            - Archives: `ascii-chat-*.zip`, `libasciichat-*.zip`

            ## Quick Start

            Choose the architecture of your computer when you download. Ask @claude how to find out your computer's architecture.
            $arch = amd64 (x86_64) or arm64 (aarch64)

            **Linux - Package Manager (no dependencies required):**
            ```bash
            sudo dpkg -i ascii-chat-${{ steps.version.outputs.version }}-$arch.deb         # Debian/Ubuntu
            sudo rpm -i ascii-chat-${{ steps.version.outputs.version }}-$arch.rpm          # Fedora/RHEL
            ```

            **Linux or macOS - Self-Extracting Installer:**
            ```bash
            chmod +x ascii-chat-${{ steps.version.outputs.version }}-$arch.sh
            sudo ./ascii-chat-${{ steps.version.outputs.version }}-$arch.sh --prefix=/usr/local
            ```

            **Linux or macOS - Portable (.tar.gz):**
            ```bash
            tar -xzf ascii-chat-${{ steps.version.outputs.version }}-$arch.tar.gz
            cd ascii-chat-${{ steps.version.outputs.version }}-$arch/bin
            ./ascii-chat server
            ```

            **macOS - Package Installer:**
            ```bash
            sudo installer -pkg ascii-chat-${{ steps.version.outputs.version }}-$arch.pkg -target /
            ```

            **Windows - MSI Installer:**
            ```
            msiexec /i ascii-chat-${{ steps.version.outputs.version }}-$arch.msi
            ```

            **Windows - Portable (.zip):**
            ```
            # Extract zip, then run from extracted folder:
            ascii-chat.exe server
            ```

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Source Tarball

            For package maintainers (Homebrew, AUR, etc.):
            - `${{ steps.tarball.outputs.tarball }}`
            - SHA256: `${{ steps.tarball.outputs.sha256 }}`
          # Keep the release private until every platform package has passed
          # its static-link audit and uploaded its runtime and development assets.
          draft: true
          prerelease: false
          files: ${{ steps.tarball.outputs.tarball }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ steps.tarball.outputs.tarball }}
          if-no-files-found: error

  package-linux:
    name: Package Linux installers
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: create-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the x86_64 release runner to the same supported Ubuntu baseline
          # as the ARM64 job. ubuntu-latest is moving to Ubuntu 26, whose
          # toolchain/dependency set is not yet supported by the release build.
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          #- runner: ubuntu-latest-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          ref: ${{ needs.create-release.outputs.version }}

      - name: Install build dependencies
        id: install-deps
        uses: ./.github/actions/install-deps
        with:
          os: ubuntu
          extra-packages: "rpm dpkg-dev fakeroot"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaging tools are available
        run: |
          echo "Verifying packaging tools..."
          which dpkg-deb || (echo "ERROR: dpkg-deb not found" && exit 1)
          which rpmbuild || (echo "ERROR: rpmbuild not found" && exit 1)
          dpkg-deb --version
          rpmbuild --version
          echo "All packaging tools verified!"

      - name: Validate CMake dependency cache
        shell: bash
        run: |
          cache_root=".deps-cache/Release"
          required=(
            "$cache_root/asciichat_libuv-src/CMakeLists.txt"
            "$cache_root/asciichat_zstd-src/CMakeLists.txt"
            "$cache_root/asciichat_portaudio-src/CMakeLists.txt"
          )
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Incomplete CMake dependency cache: missing $path"
              break
            fi
          done

      - name: Configure with CMake
        run: |
          # Use /usr prefix for Linux (FHS compliance, matches DEB/RPM packages)
          # This ensures paths.h has the correct prefix baked in for system config
          RELEASE_TAG="${{ needs.create-release.outputs.version }}"
          cmake --preset release -DPROJECT_VERSION_FROM_GIT="${RELEASE_TAG#v}" -DCMAKE_INSTALL_PREFIX=/usr -DUSE_MUSL=ON -DASCIICHAT_ENFORCE_STATIC_RELEASE=ON -DASCIICHAT_SIMD_MODE=auto -DASCIICHAT_RELEASE_CPU_TUNE=portable

      - name: Save CMake dependency cache
        if: success() && steps.install-deps.outputs.cmake-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .deps-cache
            deps/ascii-chat-deps/bearssl/build
          key: ${{ steps.install-deps.outputs.cmake-cache-key }}

      - name: Build and package with CPack
        run: |
          cmake --build build_release --target all
          cmake --build build_release --target static-lib
          # shared-lib not available on Linux (static FFmpeg can't link into .so)
          cmake --build build_release --target docs

          cmake -DEXECUTABLE="$PWD/build_release/bin/ascii-chat" -DEXPECTED_VERSION="${{ needs.create-release.outputs.version }}" -P cmake/scripts/VerifyReleaseVersion.cmake

          # Run CPack with verbose output to diagnose DEB/RPM generation issues
          cd build_release
          cpack --verbose

      - name: Verify Linux development package contains the static library
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          version="${version#v}"
          if [[ "$(uname -m)" == "aarch64" ]]; then arch="arm64"; else arch="amd64"; fi
          archive="build_release/libasciichat-${version}-Linux-${arch}.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing development archive: $archive"
            exit 1
          fi
          archive_contents="$(mktemp)"
          if ! tar -tzf "$archive" > "$archive_contents"; then
            rm -f "$archive_contents"
            echo "::error::Could not list development archive: $archive"
            exit 1
          fi
          if ! grep -Eq '(^|/)libasciichat\.a$' "$archive_contents"; then
            rm -f "$archive_contents"
            echo "::error::Development archive does not contain static libasciichat.a"
            exit 1
          fi
          rm -f "$archive_contents"
          echo "Verified static libasciichat.a in $archive"

      - name: Verify runtime manual
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          version="${version#v}"
          if [[ "$(uname -m)" == "aarch64" ]]; then arch="arm64"; else arch="amd64"; fi
          archive="build_release/ascii-chat-${version}-Linux-${arch}.tar.gz"
          tar -xOzf "$archive" share/man/man1/ascii-chat.1 > "$RUNNER_TEMP/release-man1"
          if ! grep -q 'MCP SERVER' "$RUNNER_TEMP/release-man1"; then
            echo "::error::man1 archive check failed: generated manual is missing the MCP SERVER section"
            exit 1
          fi
          tar -tzf "$archive" > "$RUNNER_TEMP/release-runtime-files"
          if ! grep -Eq '(^|/)share/man/man5/ascii-chat\.5$' "$RUNNER_TEMP/release-runtime-files"; then
            echo "::error::man5 archive check failed: runtime tarball does not contain share/man/man5/ascii-chat.5"
            exit 1
          fi

      - name: Print build logs on failure
        if: failure()
        run: |
          echo "=== Installed compiler-rt builtins packages ==="
          dpkg -L libclang-rt-22-dev 2>/dev/null | grep builtins || echo "libclang-rt-22-dev is not installed"
          echo "=== Target-aware compiler-rt lookup ==="
          musl_target=$(sed -n 's/^MUSL_TARGET:[^=]*=//p' build_release/CMakeCache.txt | head -n 1)
          musl_compiler=$(sed -n 's/^CMAKE_C_COMPILER:[^=]*=//p' build_release/CMakeCache.txt | head -n 1)
          if [[ -n "$musl_target" && -n "$musl_compiler" ]]; then
            "$musl_compiler" --target="$musl_target" -rtlib=compiler-rt -print-libgcc-file-name || true
          else
            echo "Could not read MUSL_TARGET/CMAKE_C_COMPILER from CMakeCache.txt"
          fi
          echo "=== CMake error log ==="
          cat build_release/CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMake error log"
          echo ""
          echo "=== FFmpeg configure logs ==="
          find .deps-cache/Release/musl -path '*/ffbuild/config.log' -type f -print -exec tail -n 160 {} \; 2>/dev/null || echo "No FFmpeg configure log"
          echo ""
          echo "=== ALSA and Fontconfig configure logs ==="
          echo "--- Fontconfig compiler probe ---"
          fontconfig_log=".deps-cache/Release/build/fontconfig/src/asciichat-fontconfig-musl-build/config.log"
          if [[ -f "$fontconfig_log" ]]; then
            cat "$fontconfig_log"
          else
            echo "Fontconfig log not found: $fontconfig_log"
          fi
          find .deps-cache/Release/musl -type f \( -path '*/alsa*/config.log' -o -path '*/fontconfig*/config.log' \) -print -exec tail -n 220 {} \; 2>/dev/null || echo "No ALSA/Fontconfig configure logs"
          echo ""
          echo "=== util-linux configure logs ==="
          util_linux_logs=$(find .deps-cache/Release/musl -path '*/util-linux*/config.log' -type f -print)
          if [[ -n "$util_linux_logs" ]]; then
            while IFS= read -r log; do
              echo "--- $log: compiler probe ---"
              grep -n -B 18 -A 55 'checking whether the C compiler works' "$log" || true
            done <<< "$util_linux_logs"
          else
            echo "No util-linux configure logs"
          fi
          echo ""
          echo "=== Musl toolchain/link flags ==="
          grep -E 'CMAKE_(C|EXE_LINKER)_FLAGS|CMAKE_SYSROOT|CMAKE_C_COMPILER' build_release/CMakeCache.txt 2>/dev/null || true

      - name: Print sccache stats
        if: success()
        run: sccache --show-stats || true

      - name: Save sccache directory
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: ${{ steps.install-deps.outputs.ccache-key }}

      - name: Save build directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build_release
          key: ${{ steps.install-deps.outputs.build-cache-key }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          shopt -s nullglob
          version="${{ needs.create-release.outputs.version }}"
          version="${version#v}"

          # Copy all package artifacts (component-based packaging creates multiple packages)
          # Expected packages per architecture:
          #   - ascii-chat-*.deb (runtime package)
          #   - libasciichat-dev-*.deb (development package)
          #   - libasciichat-doc-*.deb (documentation package, arch=all)
          #   - ascii-chat-*.rpm (runtime package)
          #   - libasciichat-devel-*.rpm (development package)
          #   - libasciichat-doc-*.rpm (documentation package, arch=noarch)
          #   - ascii-chat-*.tar.gz (runtime archive)
          #   - libasciichat-*.tar.gz (development archive)
          #   - ascii-chat-*.sh (runtime self-extracting installer)
          #   - libasciichat-*.sh (development self-extracting installer)
          for artifact in build_release/*.deb build_release/*.rpm build_release/*.tar.gz build_release/*.sh; do
            [[ -e "$artifact" ]] || continue
            name="${artifact##*/}"
            # The restored build cache can contain packages from an earlier release.
            # Keep only this release's versioned outputs and the shared uninstaller.
            if [[ "$name" != *"-${version}-"* && "$name" != "ascii-chat-uninstall.sh" ]]; then
              continue
            fi
            cp "$artifact" dist/
          done

          # Verify required package types exist
          echo "Checking for required package types..."
          ls -l dist

          missing=""
          ls dist/*ascii-chat*.deb 1>/dev/null 2>&1 || missing="$missing ascii-chat.deb"
          ls dist/*libasciichat*.deb 1>/dev/null 2>&1 || missing="$missing libasciichat.deb"
          ls dist/*ascii-chat*.rpm 1>/dev/null 2>&1 || missing="$missing ascii-chat.rpm"
          ls dist/*libasciichat*.rpm 1>/dev/null 2>&1 || missing="$missing libasciichat.rpm"
          ls dist/*ascii-chat*.tar.gz 1>/dev/null 2>&1 || missing="$missing ascii-chat.tar.gz"
          ls dist/*libasciichat*.tar.gz 1>/dev/null 2>&1 || missing="$missing libasciichat.tar.gz"
          ls dist/*ascii-chat*.sh 1>/dev/null 2>&1 || missing="$missing ascii-chat.sh"
          ls dist/*libasciichat*.sh 1>/dev/null 2>&1 || missing="$missing libasciichat.sh"

          if [[ -n "$missing" ]]; then
            echo "::error::Missing required packages:$missing"
            exit 1
          fi
          echo "All required packages found (runtime + development)"

      - name: Sign release packages with GPG
        run: |
          # Import GPG key from secrets
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes

          # Sign all release artifacts
          cd dist
          for file in *; do
            echo "Signing $file..."
            gpg --detach-sign --armor --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_KEY_PASSWORD }}" --local-user F315D1B948F33B2102FBD7B6B95124621822044A "$file"
          done

          # List signatures
          ls -lh *.asc

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.runner }}
          path: dist
          if-no-files-found: error

  package-macos:
    name: Package macOS installers
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
          - os: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          ref: ${{ needs.create-release.outputs.version }}

      - name: Install build dependencies
        id: install-deps
        uses: ./.github/actions/install-deps
        with:
          os: macos
          extra-packages: ""
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download LLVM static libraries
        id: llvm-static
        run: |
          # Download official LLVM release which includes static libc++ libraries
          # Homebrew LLVM doesn't include static libs, so we need the official binaries
          # Note: LLVM 20+ dropped X64 macOS binaries, so we use different versions per arch
          if [[ "$(uname -m)" == "arm64" ]]; then
            LLVM_VERSION="21.1.8"
            LLVM_ARCH="ARM64"
          else
            LLVM_VERSION="19.1.6"  # Last version with X64 macOS binaries
            LLVM_ARCH="X64"
          fi
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-macOS-${LLVM_ARCH}.tar.xz"
          LLVM_DIR="${PWD}/.deps-cache/llvm-static"
          LLVM_ARCHIVE="${RUNNER_TEMP}/LLVM-${LLVM_VERSION}-macOS-${LLVM_ARCH}.tar.xz"

          echo "Downloading LLVM ${LLVM_VERSION} for macOS ${LLVM_ARCH}..."
          mkdir -p "${LLVM_DIR}"
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            --retry-delay 10 --connect-timeout 30 --max-time 1800 \
            --output "${LLVM_ARCHIVE}" "${LLVM_URL}"
          tar -xJf "${LLVM_ARCHIVE}" -C "${LLVM_DIR}" --strip-components=1

          # Verify static libs exist
          ls -la "${LLVM_DIR}/lib/libc++.a" "${LLVM_DIR}/lib/libc++abi.a" "${LLVM_DIR}/lib/libunwind.a"

          echo "llvm-static-dir=${LLVM_DIR}" >> $GITHUB_OUTPUT
          echo "LLVM static libraries downloaded to ${LLVM_DIR}"

      - name: Validate CMake dependency cache
        shell: bash
        run: |
          cache_root=".deps-cache/Release"
          required=(
            "$cache_root/asciichat_libuv-src/CMakeLists.txt"
            "$cache_root/asciichat_zstd-src/CMakeLists.txt"
            "$cache_root/asciichat_portaudio-src/CMakeLists.txt"
          )
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Incomplete CMake dependency cache: missing $path"
              break
            fi
          done

      - name: Configure with CMake
        run: |
          LLVM_STATIC_DIR="${{ steps.llvm-static.outputs.llvm-static-dir }}"
          RELEASE_TAG="${{ needs.create-release.outputs.version }}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          # Pin an HVF-capable FreeType instead of relying on the runner's Homebrew version.
          CMAKE_ARGS="-DASCIICHAT_REQUIRE_HVF=OFF"
          if [ "${{ matrix.os }}" != "macos-15-intel" ]; then
            CMAKE_ARGS="-DASCIICHAT_REQUIRE_HVF=ON"
          fi
          CMAKE_ARGS="$CMAKE_ARGS --preset release -DPROJECT_VERSION_FROM_GIT=$RELEASE_VERSION -DASCIICHAT_LIB_VERSION=${{ needs.create-release.outputs.library_version }} -DASCIICHAT_ENFORCE_STATIC_RELEASE=ON"
          if [ -n "$LLVM_STATIC_DIR" ]; then
            echo "Using LLVM static libraries from: $LLVM_STATIC_DIR"
            CMAKE_ARGS="$CMAKE_ARGS -DASCIICHAT_LIBCXX_STATIC_ROOT=$LLVM_STATIC_DIR"
          fi
          # Intel macOS: conservative build settings to avoid startup segfaults
          # (first time Intel release builds are being tested on CI)
          if [ "$(uname -m)" = "x86_64" ] || [ "${{ matrix.os }}" = "macos-26" ]; then
            echo "Using conservative macOS release settings for runner compatibility"
            CMAKE_ARGS="$CMAKE_ARGS -DUSE_MIMALLOC=OFF -DASCIICHAT_RELEASE_ENABLE_FAST_MATH=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF"
            if [ "$(uname -m)" = "x86_64" ]; then
              # Remove static libc++ flag if it was added
              CMAKE_ARGS=$(echo "$CMAKE_ARGS" | sed 's/-DASCIICHAT_LIBCXX_STATIC_ROOT=[^ ]*//')
            fi
          fi
          cmake $CMAKE_ARGS

      - name: Save CMake dependency cache
        if: success() && steps.install-deps.outputs.cmake-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .deps-cache
            deps/ascii-chat-deps/bearssl/build
          key: ${{ steps.install-deps.outputs.cmake-cache-key }}

      - name: Build and package with CPack
        run: |
          cmake --build build_release --target all
          cmake --build build_release --target static-lib
          cmake --build build_release --target shared-lib
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            # Homebrew's Intel Doxygen currently segfaults on this project.
            # Documentation is still built for the other release platforms and
            # the source tarball; skip only this unstable packaging step.
            echo "Skipping Doxygen on macOS Intel because the runner binary crashes"
          else
            cmake --build build_release --target docs
          fi
          cmake --build build_release --target package

      - name: Smoke test macOS release executable
        run: cmake -DEXECUTABLE="$PWD/build_release/bin/ascii-chat" -DEXPECTED_VERSION="${{ needs.create-release.outputs.version }}" -P cmake/scripts/VerifyReleaseVersion.cmake

      - name: Verify runtime manual
        run: |
          version="${{ needs.create-release.outputs.version }}"
          version="${version#v}"
          if [[ "$(uname -m)" == "arm64" ]]; then arch="arm64"; else arch="amd64"; fi
          archive="build_release/ascii-chat-${version}-macOS-${arch}.tar.gz"
          tar -xOzf "$archive" share/man/man1/ascii-chat.1 > "$RUNNER_TEMP/release-man1"
          if ! grep -q 'MCP SERVER' "$RUNNER_TEMP/release-man1"; then
            echo "::error::man1 archive check failed: generated manual is missing the MCP SERVER section"
            exit 1
          fi
          tar -tzf "$archive" > "$RUNNER_TEMP/release-runtime-files"
          if ! grep -q 'share/man/man5/ascii-chat.5$' "$RUNNER_TEMP/release-runtime-files"; then
            echo "::error::man5 archive check failed: runtime tarball does not contain share/man/man5/ascii-chat.5"
            exit 1
          fi

      - name: Verify macOS development package contains the static library
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          version="${version#v}"
          if [[ "$(uname -m)" == "arm64" ]]; then arch="arm64"; else arch="amd64"; fi
          archive="build_release/libasciichat-${version}-macOS-${arch}.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing development archive: $archive"
            exit 1
          fi
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          tar -tzf "$archive" > "$listing"
          if ! grep -Eq '(^|/)libasciichat\.a$' "$listing"; then
            echo "::error::Development archive does not contain static libasciichat.a"
            exit 1
          fi
          echo "Verified static libasciichat.a in $archive"

      - name: Print sccache stats
        if: success()
        run: sccache --show-stats || true

      - name: Save sccache directory
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Mozilla.sccache
          key: ${{ steps.install-deps.outputs.ccache-key }}

      - name: Save build directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build_release
          key: ${{ steps.install-deps.outputs.build-cache-key }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          shopt -s nullglob
          version="${{ needs.create-release.outputs.version }}"
          version="${version#v}"
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch="arm64"
          else
            arch="amd64"
          fi

          # Copy all package artifacts (component-based packaging creates multiple packages)
          # Expected packages per architecture:
          #   - ascii-chat-*.pkg (runtime package)
          #   - libasciichat-*.pkg (development package)
          #   - ascii-chat-*.tar.gz (runtime archive)
          #   - libasciichat-*.tar.gz (development archive)
          #   - ascii-chat-*.sh (runtime self-extracting installer)
          #   - libasciichat-*.sh (development self-extracting installer)
          for artifact in build_release/*.pkg build_release/*.tar.gz build_release/*.sh; do
            [[ -e "$artifact" ]] || continue
            name="${artifact##*/}"
            # Exclude stale packages restored from the architecture build cache.
            [[ "$name" == *"-${version}-macOS-${arch}."* ]] || continue
            cp "$artifact" dist/
          done

          # Verify required package names, including the release version and architecture.
          echo "Checking for required package names..."
          ls -l dist

          missing=""
          [[ -f "dist/ascii-chat-${version}-macOS-${arch}.pkg" ]] || missing="$missing ascii-chat.pkg"
          [[ -f "dist/ascii-chat-${version}-macOS-${arch}.tar.gz" ]] || missing="$missing ascii-chat.tar.gz"
          [[ -f "dist/libasciichat-${version}-macOS-${arch}.tar.gz" ]] || missing="$missing libasciichat.tar.gz"
          [[ -f "dist/ascii-chat-${version}-macOS-${arch}.sh" ]] || missing="$missing ascii-chat.sh"
          [[ -f "dist/libasciichat-${version}-macOS-${arch}.sh" ]] || missing="$missing libasciichat.sh"

          if [[ -n "$missing" ]]; then
            echo "::error::Missing required packages:$missing"
            exit 1
          fi
          echo "All required packages found (runtime + development)"

      - name: Sign release packages with GPG
        run: |
          # Import GPG key from secrets
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes

          # Sign all release artifacts
          cd dist
          for file in *; do
            echo "Signing $file..."
            gpg --detach-sign --armor --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_KEY_PASSWORD }}" --local-user F315D1B948F33B2102FBD7B6B95124621822044A "$file"
          done

          # List signatures
          ls -lh *.asc

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  package-windows:
    name: Package Windows installers (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [create-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
            vcpkg-triplet: "x64-windows"
            vcpkg-static-triplet: "x64-windows-static"
          - runner: windows-11-arm
            arch: arm64
            vcpkg-triplet: "arm64-windows"
            vcpkg-static-triplet: "arm64-windows-static"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          ref: ${{ needs.create-release.outputs.version }}

      - name: Verify and clean BearSSL submodule
        shell: pwsh
        run: |
          # Verify BearSSL source files exist (debug for CI issues)
          Write-Host "=== BearSSL submodule verification ==="
          Write-Host "Checking if deps/ascii-chat-deps/bearssl exists..."
          if (!(Test-Path "deps/ascii-chat-deps/bearssl")) {
            Write-Host "ERROR: deps/ascii-chat-deps/bearssl directory not found!"
            exit 1
          }
          Write-Host "Checking if deps/ascii-chat-deps/bearssl/src/aead/ccm.c exists..."
          if (!(Test-Path "deps/ascii-chat-deps/bearssl/src/aead/ccm.c")) {
            Write-Host "ERROR: deps/ascii-chat-deps/bearssl/src/aead/ccm.c not found!"
            Write-Host "Contents of deps/ascii-chat-deps/bearssl:"
            Get-ChildItem -Path "deps/ascii-chat-deps/bearssl" -Recurse | Select-Object -First 50
            exit 1
          }
          Write-Host "BearSSL source files verified OK"

          Write-Host "BearSSL ready for build"

      - name: Install dependencies
        id: install-deps
        uses: ./.github/actions/install-deps
        with:
          os: windows
          vcpkg-packages: "zstd portaudio libsodium fftw3 opus"
          vcpkg-static-packages: "zstd portaudio libsodium fftw3 opus mimalloc"
          vcpkg-triplet: ${{ matrix.vcpkg-triplet }}
          vcpkg-static-triplet: ${{ matrix.vcpkg-static-triplet }}
          windows-libs-mode: static
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WiX toolset
        if: matrix.arch != 'arm64'
        run: |
          choco install wixtoolset --no-progress -y

      - name: Set up MSVC developer environment
        if: matrix.arch == 'amd64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate CMake dependency cache
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $PWD ".deps-cache\Release"
          $required = @(
            (Join-Path $cacheRoot "asciichat_libuv-src\CMakeLists.txt"),
            (Join-Path $cacheRoot "asciichat_zstd-src\CMakeLists.txt"),
            (Join-Path $cacheRoot "asciichat_portaudio-src\CMakeLists.txt")
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Host "Incomplete CMake dependency cache: missing $path"
              break
            }
          }

      - name: Configure with CMake
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}".TrimStart("v")
          $args = @("--preset", "windows-release", "-B", "build_release",
            "-DPROJECT_VERSION_FROM_GIT=$version",
            "-DASCIICHAT_LIB_VERSION=${{ needs.create-release.outputs.library_version }}",
            "-DASCIICHAT_ENABLE_ANALYZERS=OFF",
            "-DASCIICHAT_ENABLE_NSIS=OFF",
            "-DASCIICHAT_ENFORCE_STATIC_RELEASE=ON",
            "-DASCIICHAT_TARGET_ARM64=${{ matrix.arch == 'arm64' && 'ON' || 'OFF' }}",
            "-DASCIICHAT_SKIP_RUNTIME_GENERATED_DOCS=${{ matrix.arch == 'arm64' && 'ON' || 'OFF' }}",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg-static-triplet }}")
          # ARM64 CRT path fix is handled in cmake/platform/WindowsWorkarounds.cmake
          cmake @args

      - name: Save vcpkg cache
        if: success() && steps.install-deps.outputs.vcpkg-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg
          key: Windows-${{ runner.arch }}-vcpkg-v1-530d2d2-${{ matrix.vcpkg-triplet }}-${{ matrix.vcpkg-static-triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**', 'vcpkg-triplets/**') }}

      - name: Save CMake dependency cache
        if: success() && steps.install-deps.outputs.cmake-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .deps-cache
            deps/ascii-chat-deps/bearssl/build
          key: ${{ steps.install-deps.outputs.cmake-cache-key }}

      - name: Download manual for Windows ARM
        if: matrix.arch == 'arm64'
        uses: actions/download-artifact@v4
        with:
          name: release-man1
          path: build_release/share/man/man1

      - name: Build and package with CPack
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build_release --target ascii-chat
          cmake --build build_release --target static-lib
          Write-Host "Skipping Doxygen documentation target on Windows"
          cmake --build build_release --target package

      - name: Verify static Windows release packages
        shell: pwsh
        run: |
          cmake "-DEXECUTABLE=$PWD/build_release/bin/ascii-chat.exe" "-DEXPECTED_VERSION=${{ needs.create-release.outputs.version }}" -P cmake/scripts/VerifyReleaseVersion.cmake
          if ($LASTEXITCODE -ne 0) { throw "Release executable --version failed: $LASTEXITCODE" }
          $version = "${{ needs.create-release.outputs.version }}".TrimStart("v")
          $arch = "${{ matrix.arch }}"
          $runtimeZip = "build_release/ascii-chat-$version-Windows-$arch.zip"
          $developmentZip = "build_release/libasciichat-$version-Windows-$arch.zip"
          if (-not (Test-Path $runtimeZip)) { throw "Missing runtime archive: $runtimeZip" }
          if (-not (Test-Path $developmentZip)) { throw "Missing development archive: $developmentZip" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $runtimeArchive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $runtimeZip))
          try {
            $runtimeEntries = @($runtimeArchive.Entries | ForEach-Object FullName)
          }
          finally { $runtimeArchive.Dispose() }
          $runtimeDlls = @($runtimeEntries | Where-Object { $_ -match '(?i)\.dll$' })
          if ($runtimeDlls.Count -gt 0) {
            throw "Runtime archive contains DLL dependencies: $($runtimeDlls -join ', ')"
          }
          $developmentArchive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $developmentZip))
          try { $developmentEntries = @($developmentArchive.Entries | ForEach-Object FullName) }
          finally { $developmentArchive.Dispose() }
          if (-not ($developmentEntries | Where-Object { $_ -match '(?i)(^|/)libasciichat\.a$' })) {
            throw "Development archive does not contain the static libasciichat archive. Entries: $($developmentEntries -join ', ')"
          }
          Write-Host "Runtime archive contains no DLL dependencies; development archive contains libasciichat.a"

      - name: Print sccache stats
        if: success()
        shell: bash
        run: sccache --show-stats || true

      - name: Save sccache directory
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/Temp/sccache
          key: ${{ steps.install-deps.outputs.ccache-key }}

      - name: Save build directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build_release
          key: ${{ steps.install-deps.outputs.build-cache-key }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ needs.create-release.outputs.version }}".TrimStart("v")
          $arch = "${{ matrix.arch }}"

          # Copy only this release's package artifacts (component-based packaging creates multiple packages).
          # Expected packages:
          #   - ascii-chat.msi (runtime package - single installer with optional components)
          #   - ascii-chat-*.zip (runtime archive)
          #   - libasciichat-*.zip (development archive)
          # Note: WIX creates a single .msi with selectable components, not separate .msi files
          $patterns = @("build_release/*-$version-Windows-$arch.msi", "build_release/*-$version-Windows-$arch.zip")
          foreach ($pattern in $patterns) {
            foreach ($artifact in Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue) {
              Copy-Item $artifact.FullName dist/
            }
          }

          # Verify required package names, including the release version and target architecture.
          Write-Host "Checking for required package names..."
          Get-ChildItem dist

          $missing = @()
          # MSI only on amd64 (WiX v3 is x86-only, can't run on ARM64)
          if ($arch -ne "arm64") {
            if (-not (Test-Path "dist/ascii-chat-$version-Windows-$arch.msi")) { $missing += "ascii-chat.msi" }
          }
          if (-not (Test-Path "dist/ascii-chat-$version-Windows-$arch.zip")) { $missing += "ascii-chat.zip" }
          if (-not (Test-Path "dist/libasciichat-$version-Windows-$arch.zip")) { $missing += "libasciichat.zip" }

          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing required packages: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required packages found (runtime + development)"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  publish-release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [create-release, package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create and publish release after every package job passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f ! -name 'release-man1' -printf '%p\n' | sort)
          source_tarball=""
          installer_count=0
          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            if [[ "$name" == ascii-chat-*-full.tar.gz ]]; then
              source_tarball="$asset"
              continue
            fi
            case "$name" in
              *.deb|*.rpm|*.pkg|*.msi|*.zip|*.sh|*.tar.gz) installer_count=$((installer_count + 1)) ;;
            esac
          done
          if [[ -z "$source_tarball" ]]; then
            echo "::error::Missing full source tarball in downloaded release artifacts"
            exit 1
          fi
          if (( installer_count == 0 )); then
            echo "::error::No installer/package assets were downloaded"
            exit 1
          fi
          source_sha256="$(sha256sum "$source_tarball" | cut -d' ' -f1)"
          generated_notes="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG")"
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)"
          if [[ -z "$previous_tag" ]]; then
            previous_tag="initial release"
          fi
          {
            printf 'Video chat in your terminal.\n\n'
            printf '## Downloads\n\n'
            printf 'Choose `amd64` for x86-64 computers or `arm64` for ARM64 computers. Runtime packages contain the executable, shell completions, and the `ascii-chat(1)` and `ascii-chat(5)` manuals; `libasciichat` packages contain development files.\n\n'
            printf '%s\n\n' '- **Linux:** choose the `.deb`, `.rpm`, `.tar.gz`, or self-extracting `.sh` runtime package for your architecture. Linux executables are statically linked with musl and do not require third-party shared libraries.'
            printf '%s\n\n' '- **macOS:** choose the `.pkg`, `.tar.gz`, or `.sh` runtime package for your architecture. Only Apple system libraries are permitted.'
            printf '%s\n\n' '- **Windows:** choose the `.zip` runtime package for your architecture, or the amd64 `.msi` installer. Windows ARM64 ships as ZIP because WiX v3 cannot produce an ARM64 MSI.'
            printf 'For example, install Debian/Ubuntu with `sudo dpkg -i ascii-chat-%s-amd64.deb`, install macOS with the matching `.pkg`, or extract the archive for your platform and run `ascii-chat --help`. Linux and macOS self-extracting installers accept `--prefix=/usr/local`.\n\n' "${RELEASE_TAG#v}"
            printf '## Improvements breakdown: %s -> %s\n\n' "$previous_tag" "$RELEASE_TAG"
            jq -r '.body' <<<"$generated_notes"
            printf '\n## Source Tarball\n\nFor package maintainers (Homebrew, AUR, etc.):\n- `%s`\n- SHA256: `%s`\n' "${source_tarball##*/}" "$source_sha256"
          } > release-notes.md
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ascii-chat $RELEASE_TAG" \
            --notes-file release-notes.md

  notify:
    name: Send release notification
    if: ${{ !cancelled() && needs.create-release.result != 'skipped' }}
    needs:
      [
        create-release,
        package-linux,
        package-macos,
        package-windows,
        publish-release,
      ]
    uses: ./.github/workflows/notify.yml
    secrets: inherit
    with:
      subject: "${{ needs.create-release.result == 'success' && needs.package-linux.result == 'success' && needs.package-macos.result == 'success' && needs.package-windows.result == 'success' && needs.publish-release.result == 'success' && '✅' || '❌' }} ascii-chat release ${{ needs.create-release.outputs.version || github.ref_name }} - ${{ needs.create-release.result == 'success' && needs.package-linux.result == 'success' && needs.package-macos.result == 'success' && needs.package-windows.result == 'success' && needs.publish-release.result == 'success' && 'SUCCESS' || 'FAILED' }}"
      body: |
        ascii-chat release ${{ needs.create-release.outputs.version || github.ref_name }}: ${{ needs.create-release.result == 'success' && needs.package-linux.result == 'success' && needs.package-macos.result == 'success' && needs.package-windows.result == 'success' && needs.publish-release.result == 'success' && 'SUCCESS' || 'FAILED' }}

        Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version || github.ref_name }}
        Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

        Job Results:
          create-release: ${{ needs.create-release.result }}
          package-linux:  ${{ needs.package-linux.result }}
          package-macos:  ${{ needs.package-macos.result }}
          package-windows: ${{ needs.package-windows.result }}
          publish-release: ${{ needs.publish-release.result }}

