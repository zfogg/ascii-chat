name: Doxygen Documentation

on:
  push:
    branches:
      - master
    paths:
      - "lib/**/*.c"
      - "lib/**/*.h"
      - "lib/**/*.cpp"
      - "lib/**/*.hpp"
      - "src/**/*.c"
      - "src/**/*.h"
      - "src/**/*.cpp"
      - "src/**/*.hpp"
      - "**/*.m"
      - "include/**/*.c"
      - "include/**/*.h"
      - "docs/**"
      - ".gitmodules"
      - ".github/workflows/doxygen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          # Only the documentation theme is needed; do not initialize native
          # dependency submodules or their nested build graph.
          submodules: false

      - name: Checkout documentation theme
        run: git submodule update --init --depth 1 deps/doxygen-awesome-css

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz cmake

      - name: Configure documentation-only CMake project
        run: cmake -S docs -B build_docs -DASCII_CHAT_SOURCE_DIR="$GITHUB_WORKSPACE"

      - name: Build documentation
        run: cmake --build build_docs --target docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build_docs/share/doc/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
