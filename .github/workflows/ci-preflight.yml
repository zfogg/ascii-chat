name: CI preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pull-request workflows normally check out GitHub's synthetic merge
          # commit. Preflight compares against the event's base SHA, which can
          # be older than the current target branch; validate the PR head so
          # unrelated target-branch changes are not attributed to this patch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Validate Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck='' .github/workflows/*.yml
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git diff --check "$BASE_SHA" HEAD
          else
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
            if [ "$base" = "$(git rev-parse HEAD)" ]; then base=$(git rev-parse HEAD^); fi
            git diff --check "$base" HEAD
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format
      - name: Check changed C and C++ formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
            if [ "$base" = "$(git rev-parse HEAD)" ]; then base=$(git rev-parse HEAD^); fi
          fi
          git diff --name-only -z --diff-filter=ACMR "$base" HEAD -- \
            '*.c' '*.h' '*.cpp' '*.hpp' '*.m' \
            | xargs -0 --no-run-if-empty clang-format --dry-run -Werror
