name: Submit WinGet manifest

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, for example v0.16.34
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: Open WinGet manifest PR
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -n "$MANUAL_TAG" ]]; then
            tag="$MANUAL_TAG"
          else
            git init source
            git -C source remote add origin "https://github.com/$REPOSITORY.git"
            git -C source fetch --quiet --depth=1 origin "$RUN_SHA"
            tag="$(git -C source tag --points-at FETCH_HEAD --list 'v*' | head -n 1)"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine a release tag from workflow run: '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          # The selected release may predate this workflow. Use the current
          # default branch for the submission tooling and target the release
          # asset selected above.
          ref: master

      - name: Generate and submit manifest PR
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          WINGET_FORK_REPOSITORY: ${{ vars.WINGET_FORK_REPOSITORY || 'zfogg/winget-pkgs' }}
        run: |
          bash scripts/winget/submit-manifest.sh \
            "${{ steps.release.outputs.version }}" \
            "$GITHUB_REPOSITORY"
