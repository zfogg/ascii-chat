name: SIMD terminal emission

on:
  pull_request:
    paths:
      - "lib/video/**"
      - "include/ascii-chat/video/**"
      - "tests/simd/**"
      - "tests/unit/video/ascii_emission_test.c"
      - ".github/workflows/simd-emission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross compiler and emulator
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build gcc-aarch64-linux-gnu qemu-user
      - name: x86 cell equivalence and memory safety
        run: |
          cmake -S tests/simd -B build-emission -G Ninja -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Release -DTEST_EMISSION=ON -DCMAKE_C_FLAGS=-fsanitize=address,undefined
          cmake --build build-emission --target emission-test simd-test --parallel 4
          ctest --test-dir build-emission --output-on-failure
      - name: ARM64 cross build
        run: |
          cmake -S tests/simd -B build-emission-arm -G Ninja -DCMAKE_C_COMPILER=clang \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu -DCMAKE_C_FLAGS=--gcc-toolchain=/usr \
            -DCMAKE_BUILD_TYPE=Release -DTEST_EMISSION=ON
          cmake --build build-emission-arm --target emission-test simd-test --parallel 4
      - name: NEON fallback and SVE at every vector length
        run: |
          qemu-aarch64 -L /usr/aarch64-linux-gnu -cpu cortex-a53 build-emission-arm/emission-test
          for length in 16 32 64 128 256; do
            qemu-aarch64 -L /usr/aarch64-linux-gnu -cpu max build-emission-arm/emission-test "$length"
          done
          ASCII_CHAT_SIMD=scalar qemu-aarch64 -L /usr/aarch64-linux-gnu -cpu cortex-a53 build-emission-arm/simd-test scalar
          ASCII_CHAT_SIMD=sve qemu-aarch64 -L /usr/aarch64-linux-gnu -cpu max build-emission-arm/simd-test sve 16
