name: Deploy web client

on:
  push:
    branches:
      - deploy-web-web

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy web.ascii-chat.com
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Link the existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@latest link --yes
          --project ascii-chat-web
          --scope joopal-hackers-projects
          --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@latest deploy --prod --yes
          --scope joopal-hackers-projects
          --token "$VERCEL_TOKEN"
