name: Deploy website

on:
  push:
    branches:
      - deploy-web-www

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ascii-chat.com
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Link the existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@latest link --yes
          --project ascii-chat-www
          --scope joopal-hackers-projects
          --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@latest deploy --prod --yes
          --scope joopal-hackers-projects
          --token "$VERCEL_TOKEN"

  notify:
    name: Send deployment notification
    if: always() && needs.deploy.result != 'skipped'
    needs: [deploy]
    uses: ./.github/workflows/notify.yml
    secrets: inherit
    with:
      subject: "${{ needs.deploy.result == 'success' && '✅' || '❌' }} ascii-chat.com deployment - ${{ needs.deploy.result == 'success' && 'SUCCESS' || 'FAILED' }}"
      body: |
        ascii-chat.com deployment: ${{ needs.deploy.result == 'success' && 'SUCCESS' || 'FAILED' }}

        Site: https://ascii-chat.com/
        Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        Deployment job: ${{ needs.deploy.result }}
