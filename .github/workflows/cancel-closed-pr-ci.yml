name: Cancel closed PR CI

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel validation runs belonging to this PR
        uses: actions/github-script@v7
        with:
          script: |
            // Never check out or execute the pull request's code in this workflow.
            const pr = context.payload.pull_request;
            const validation = new Set([
              'build.yml', 'test.yml', 'analysis.yml', 'security.yml',
              'markdown.yml', 'web-tests.yml',
            ]);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, event: 'pull_request', per_page: 100,
              created: `>=${pr.created_at}`,
            });
            for (const run of runs) {
              if (run.status === 'completed') continue;
              const file = run.path.split('/').pop().split('@')[0];
              if (!validation.has(file)) continue;
              let associated = run.pull_requests || [];
              if (associated.length === 0) {
                associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                  ...context.repo, commit_sha: run.head_sha, per_page: 100,
                });
              }
              let belongsToPr = associated.some(p => p.number === pr.number);
              if (!belongsToPr && associated.length === 0 && pr.head.repo) {
                // Deleted, unmerged branches can lose both API associations.
                // Restrict fallback to the exact source repository/branch and
                // the PR lifetime, and refuse ambiguous overlapping PRs.
                const sameSource = run.head_repository?.id === pr.head.repo.id &&
                  run.head_branch === pr.head.ref;
                const inLifetime = run.created_at >= pr.created_at &&
                  run.created_at <= pr.closed_at;
                if (sameSource && inLifetime) {
                  const siblings = await github.paginate(github.rest.pulls.list, {
                    ...context.repo, state: 'all',
                    head: `${pr.head.repo.owner.login}:${pr.head.ref}`, per_page: 100,
                  });
                  const ambiguous = siblings.some(p => p.number !== pr.number &&
                    p.created_at <= run.created_at &&
                    (!p.closed_at || p.closed_at >= run.created_at));
                  belongsToPr = !ambiguous;
                }
              }
              if (!belongsToPr) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                core.info(`Canceled ${run.name}: ${run.html_url}`);
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info(`Run ${run.id} already finished.`);
              }
            }
