name: Submit package-manager updates

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.16.34
        required: true
        type: string
      target:
        description: Package manager to update
        required: true
        default: all
        type: choice
        options: [all, winget, scoop, chocolatey, npackd, homebrew]

permissions:
  contents: read

jobs:
  submit:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [winget, scoop, chocolatey, npackd, homebrew]
    steps:
      - name: Select target and release
        id: selection
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          MANUAL_TARGET: ${{ inputs.target }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init source
          git -C source remote add origin "https://github.com/$REPOSITORY.git"
          if [[ -n "$MANUAL_TAG" ]]; then tag="$MANUAL_TAG"; else
            [[ -n "$RUN_SHA" ]] || { echo "Release workflow SHA is missing" >&2; exit 1; }
            tag="$(git -C source ls-remote --tags origin 'refs/tags/v*' |
              awk -v sha="$RUN_SHA" '$1 == sha && $2 ~ /\^\{\}$/ {
                sub(/^refs\/tags\//, "", $2)
                sub(/\^\{\}$/, "", $2)
                print $2
                exit
              }')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          git -C source fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          tag_sha="$(git -C source rev-list -n 1 "$tag")"
          if [[ -n "$RUN_SHA" && "$tag_sha" != "$RUN_SHA" ]]; then
            echo "Release tag $tag points to $tag_sha, not triggering commit $RUN_SHA" >&2
            exit 1
          fi
          if [[ "$MANUAL_TARGET" == "all" || -z "$MANUAL_TARGET" || "$MANUAL_TARGET" == "${{ matrix.target }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout package tooling
        if: steps.selection.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install gomplate
        if: steps.selection.outputs.run == 'true'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/hairyhenderson/gomplate/releases/download/v4.3.0/gomplate_linux-amd64 \
            --output "$RUNNER_TEMP/gomplate"
          chmod +x "$RUNNER_TEMP/gomplate"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gomplate" --version

      - name: Submit package-manager update
        if: steps.selection.outputs.run == 'true'
        env:
          PACKAGE_MANAGER_GITHUB_TOKEN: ${{ secrets.PACKAGE_MANAGER_GITHUB_TOKEN }}
          WINGET_FORK_REPOSITORY: zfogg/winget-pkgs
          SCOOP_REPOSITORY: zfogg/ascii-chat-scoop
          CHOCOLATEY_FORK_REPOSITORY: zfogg/chocolatey-packages
          NPACKD_REPOSITORY: zfogg/npackd-repository
          HOMEBREW_REPOSITORY: zfogg/homebrew-ascii-chat
        run: bash scripts/package-managers/submit.sh "${{ matrix.target }}" "${{ steps.selection.outputs.version }}" "$GITHUB_REPOSITORY"
