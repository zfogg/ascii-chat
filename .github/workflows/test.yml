name: Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**.c"
      - "**.h"
      - "**.m"
      - "tests/**"
      - "CMakeLists.txt"
      - "**/CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/test.yml"
      - "codecov.yml"
      - ".github/scripts/*coverage*.py"
      - ".github/actions/generate-coverage/**"
      - ".github/actions/publish-test-results/**"
  pull_request:
    branches: ["*"]
    paths:
      - "**.c"
      - "**.h"
      - "**.m"
      - "tests/**"
      - "CMakeLists.txt"
      - "**/CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/test.yml"
      - "codecov.yml"
      - ".github/scripts/*coverage*.py"
      - ".github/actions/generate-coverage/**"
      - ".github/actions/publish-test-results/**"

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

env:
  CC: clang
  CXX: clang++

jobs:
  coverage-tools:
    name: Coverage report regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gcovr
      - run: python .github/scripts/test_generate_coverage.py

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        build_type: [debug, release]
        # The macOS Debug/sanitizer combination currently reports unrelated
        # platform-specific test failures. Keep macOS Release coverage and
        # the sanitizer-enabled Ubuntu Debug coverage in the CI matrix.
        exclude:
          - os: macos-15
            build_type: debug
        include:
          - os: ubuntu-latest
            os-name: ubuntu
          - os: macos-15
            os-name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          submodules: true

      - name: Install dependencies with caching
        uses: ./.github/actions/install-deps
        with:
          os: ${{ matrix.os-name }}
          extra-packages: ${{ matrix.os-name == 'ubuntu' && 'lcov gcovr libc6-dbg' || 'gcovr' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache build, dependencies, and ccache
        id: cache-build
        uses: ./.github/actions/cache-build
        with:
          cache-version: v7
          build-cache-key: ${{ matrix.build_type }}

      - name: Clean test executables and libraries only
        run: |
          # Only clean test executables and old libraries
          # Keep CMakeCache.txt and CMakeFiles to preserve configure cache across build type changes
          rm -rf build/bin/test_*
          rm -rf build/lib/*.a

      - name: Build test suite (${{ matrix.build_type }})
        run: |
          # Use CMake build system
          BUILD_TYPE=${{ matrix.build_type == 'debug' && 'Debug' || 'Release' }}

          # Set additional C flags based on build type
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            EXTRA_FLAGS="--coverage"
          else
            EXTRA_FLAGS=""
          fi

          # Use Homebrew LLVM on macOS for better standards support
          # Detect Homebrew prefix (ARM Mac uses /opt/homebrew, Intel uses /usr/local)
          if [ "${{ matrix.os-name }}" = "macos" ]; then
            if [ -d "/opt/homebrew/opt/llvm" ]; then
              HOMEBREW_PREFIX="/opt/homebrew"
            elif [ -d "/usr/local/opt/llvm" ]; then
              HOMEBREW_PREFIX="/usr/local"
            else
              echo "Error: Homebrew LLVM not found at /opt/homebrew or /usr/local"
              exit 1
            fi
            CLANG_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang"
            CLANGXX_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang++"
            echo "Using Homebrew LLVM from: ${HOMEBREW_PREFIX}/opt/llvm"
          else
            CLANG_BIN="clang"
            CLANGXX_BIN="clang++"
          fi

          FLAGS="-std=c2x"
          if [ -n "${EXTRA_FLAGS}" ]; then
            FLAGS="${FLAGS} ${EXTRA_FLAGS}"
          fi

          echo "Building with CMake build type: ${BUILD_TYPE}"
          cmake_args=(
            -DBUILD_TESTS=ON
            -DUSE_MUSL=OFF
            -DASCIICHAT_FORCE_CRITERION_TESTS=ON
            -DASCIICHAT_ENABLE_ANALYZERS=OFF
            -DASCIICHAT_ENABLE_COVERAGE=ON
            -DCMAKE_C_COMPILER="${CLANG_BIN}"
            -DCMAKE_CXX_COMPILER="${CLANGXX_BIN}"
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
            -DCMAKE_C_FLAGS="${FLAGS}"
          )

          if [ "${BUILD_TYPE}" = "Release" ]; then
            cmake_args+=(-DASCIICHAT_ENFORCE_STATIC_RELEASE=OFF)
            # Force Criterion tests in Release mode for CI testing
            # Must use ASCIICHAT_FORCE_CRITERION_TESTS (cache option) not BUILD_CRITERION_TESTS (regular variable)
            cmake_args+=(-DASCIICHAT_FORCE_CRITERION_TESTS=ON)
            # Disable coverage for Release builds (github preset has it ON by default)
            cmake_args+=(-DASCIICHAT_ENABLE_COVERAGE=OFF)
            # Skip hardening validation (linker checks may fail in CI environment)
            cmake_args+=(-DASCIICHAT_SKIP_HARDENING_VALIDATION=ON)
          fi

          # Clean configure (cached builds may have USE_MUSL=ON or stale settings)
          rm -rf build/
          cmake -B build -G Ninja "${cmake_args[@]}"

      - name: Save configure cache (unit-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Clear cached coverage counters
        run: find build -name '*.gcda' -type f -delete

      - name: Build test suite
        run: |
          cmake --build build

          echo "Test executables built:"
          ls -la build/bin/test_* 2>/dev/null || echo "No test executables found in build/bin/"
          echo "All files in build/bin:"
          ls -la build/bin/ 2>/dev/null || echo "build/bin/ directory not found"

      - name: Run unit tests
        run: |
          echo "Running tests with build type: ${{ matrix.build_type }}"

          # Debug: check CTestTestfile
          echo "=== CTestTestfile.cmake ==="
          cat build/CTestTestfile.cmake 2>/dev/null || echo "No CTestTestfile.cmake in build/"
          echo "=== tests/CTestTestfile.cmake ==="
          head -30 build/tests/CTestTestfile.cmake 2>/dev/null || echo "No CTestTestfile.cmake in build/tests/"

          # Debug: list all tests ctest knows about
          echo "=== ctest -N (list tests) ==="
          ctest --test-dir build -N 2>&1 | head -20

          # Debug: try running one test directly
          echo "=== Direct test run ==="
          ls -la build/bin/test_unit_crypto_common 2>/dev/null && build/bin/test_unit_crypto_common --help 2>&1 | head -5 || echo "test binary not found"

          # Run unit tests (filtered by label)
          ctest --test-dir build --label-regex "^unit$" --output-on-failure --parallel 2 | tee unit-tests-${{ matrix.os-name }}-${{ matrix.build_type }}.log

          echo "Unit tests completed successfully"

      - name: Generate coverage report (debug builds only)
        if: always() && matrix.build_type == 'debug'
        uses: ./.github/actions/generate-coverage
        with:
          os-type: ${{ matrix.os-name }}

      - name: Save build caches
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Save build cache (unit-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Publish Test Results and Coverage
        uses: ./.github/actions/publish-test-results
        if: always()
        with:
          test-type: unit
          os-name: ${{ matrix.os-name }}
          build-type: ${{ matrix.build_type }}
          criterion-xml-dir: build/Testing/criterion-xml
          coverage-files: "build/coverage.xml"
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          upload-coverage: ${{ matrix.build_type == 'debug' && 'true' || 'false' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}-${{ matrix.build_type }}
          path: |
            unit-tests-*.log
            build/Testing/criterion-xml/*.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        include:
          - os: ubuntu-latest
            os-name: ubuntu
          - os: macos-15
            os-name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          submodules: true

      - name: Install dependencies with caching
        uses: ./.github/actions/install-deps
        with:
          os: ${{ matrix.os-name }}
          extra-packages: ${{ matrix.os-name == 'ubuntu' && 'lcov gcovr' || 'gcovr' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache build, dependencies, and ccache
        id: cache-build
        uses: ./.github/actions/cache-build
        with:
          cache-version: v7

      - name: Clean test executables and libraries only
        run: |
          # Only clean test executables and old libraries
          # Keep CMakeCache.txt and CMakeFiles to preserve configure cache
          rm -rf build/bin/test_*
          rm -rf build/lib/*.a

      - name: Configure integration tests with coverage
        run: |
          echo "Configuring integration tests with coverage build..."
          # Use CMake build system with coverage
          # Use Homebrew LLVM on macOS for better standards support
          # Detect Homebrew prefix (ARM Mac uses /opt/homebrew, Intel uses /usr/local)
          if [ "${{ matrix.os-name }}" = "macos" ]; then
            if [ -d "/opt/homebrew/opt/llvm" ]; then
              HOMEBREW_PREFIX="/opt/homebrew"
            elif [ -d "/usr/local/opt/llvm" ]; then
              HOMEBREW_PREFIX="/usr/local"
            else
              echo "Error: Homebrew LLVM not found at /opt/homebrew or /usr/local"
              exit 1
            fi
            CLANG_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang"
            CLANGXX_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang++"
            echo "Using Homebrew LLVM from: ${HOMEBREW_PREFIX}/opt/llvm"
          else
            CLANG_BIN="clang"
            CLANGXX_BIN="clang++"
          fi

          FLAGS="-std=c2x --coverage"

          cmake -B build --preset github --debug-output \
            -DCMAKE_C_COMPILER="${CLANG_BIN}" -DCMAKE_CXX_COMPILER="${CLANGXX_BIN}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="${FLAGS}" \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Save configure cache (integration-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Clear cached coverage counters
        run: find build -name '*.gcda' -type f -delete

      - name: Build and run integration tests
        run: |
          cmake --build build
          python3 tests/integration/render_file_audio.py build/bin/ascii-chat

          # Run integration tests via ctest preset
          # Criterion generates detailed XML in build/Testing/criterion-xml/
          ctest --test-dir build --label-regex "^integration$" --output-on-failure --parallel 0 | tee integration-tests-${{ matrix.os-name }}.log

          echo "Integration tests completed successfully"

      - name: Generate coverage report
        if: always()
        uses: ./.github/actions/generate-coverage
        with:
          os-type: ${{ matrix.os-name }}

      - name: Save build cache (integration-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Publish Test Results and Coverage
        uses: ./.github/actions/publish-test-results
        if: always()
        with:
          test-type: integration
          os-name: ${{ matrix.os-name }}
          criterion-xml-dir: build/Testing/criterion-xml
          coverage-files: "build/coverage.xml"
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          upload-coverage: "true"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ runner.os }}
          path: |
            integration-tests-*.log
            build/Testing/criterion-xml/*.xml
          retention-days: 7

  performance-tests:
    name: Performance Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          submodules: true

      - name: Install dependencies with caching
        uses: ./.github/actions/install-deps
        with:
          os: ${{ startsWith(matrix.os, 'ubuntu') && 'ubuntu' || 'macos' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache build, dependencies, and ccache
        id: cache-build
        uses: ./.github/actions/cache-build
        with:
          cache-version: v7

      - name: Clean test executables and libraries only
        run: |
          # Only clean test executables and old libraries
          # Keep CMakeCache.txt and CMakeFiles to preserve configure cache
          rm -rf build/bin/test_*
          rm -rf build/lib/*.a

      - name: Configure performance tests with coverage
        run: |
          # Configure performance tests with Release mode + coverage for accurate performance
          # Use Homebrew LLVM on macOS for better standards support
          # Detect Homebrew prefix (ARM Mac uses /opt/homebrew, Intel uses /usr/local)
          if [ "${{ startsWith(matrix.os, 'macos') && 'macos' || 'ubuntu' }}" = "macos" ]; then
            if [ -d "/opt/homebrew/opt/llvm" ]; then
              HOMEBREW_PREFIX="/opt/homebrew"
            elif [ -d "/usr/local/opt/llvm" ]; then
              HOMEBREW_PREFIX="/usr/local"
            else
              echo "Error: Homebrew LLVM not found at /opt/homebrew or /usr/local"
              exit 1
            fi
            CLANG_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang"
            CLANGXX_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang++"
            echo "Using Homebrew LLVM from: ${HOMEBREW_PREFIX}/opt/llvm"
          else
            CLANG_BIN="clang"
            CLANGXX_BIN="clang++"
          fi

          echo "Configuring performance tests with Release optimization and coverage instrumentation..."
          FLAGS="-std=c2x -O3 --coverage"

          cmake_args=(
            --preset github
            -DCMAKE_C_COMPILER="${CLANG_BIN}"
            -DCMAKE_CXX_COMPILER="${CLANGXX_BIN}"
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_FLAGS="${FLAGS}"
            -DASCIICHAT_ENFORCE_STATIC_RELEASE=OFF
            -DUSE_MUSL=OFF
            -DASCIICHAT_SHARED_DEPS=ON
            # Skip hardening validation - coverage builds embed .gcda paths in binary
            -DASCIICHAT_SKIP_HARDENING_VALIDATION=ON
          )

          # Clean configure (cached builds may have USE_MUSL=ON or stale settings)
          rm -rf build/
          cmake -B build -G Ninja "${cmake_args[@]}"

      - name: Save configure cache (performance-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Clear cached coverage counters
        run: find build -name '*.gcda' -type f -delete

      - name: Build performance tests
        run: |
          cmake --build build
          echo "Performance test executables built:"
          ls -la build/bin/test_performance_* 2>/dev/null || echo "No performance test executables found"

      - name: Run performance tests
        run: |
          echo "Running performance tests..."

          # Run performance tests via ctest preset
          # Criterion generates detailed XML in build/Testing/criterion-xml/
          ctest --test-dir build --label-regex "^performance$" --output-on-failure --parallel 0 | tee performance-tests-${{ startsWith(matrix.os, 'ubuntu') && 'ubuntu' || 'macos' }}.log

          echo "Performance tests completed successfully"

      - name: Save build cache (performance-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Generate coverage report for performance tests
        if: always()
        uses: ./.github/actions/generate-coverage
        with:
          os-type: ${{ startsWith(matrix.os, 'macos') && 'macos' || 'ubuntu' }}

      - name: Publish Test Results and Coverage
        uses: ./.github/actions/publish-test-results
        if: always()
        with:
          test-type: performance
          os-name: ${{ startsWith(matrix.os, 'ubuntu') && 'ubuntu' || 'macos' }}
          criterion-xml-dir: build/Testing/criterion-xml
          coverage-files: "build/coverage.xml"
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          upload-coverage: "true"

      - name: Upload performance test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results-${{ runner.os }}
          path: |
            performance-tests-*.log
            build/Testing/criterion-xml/*.xml
          retention-days: 7

  memory-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          submodules: true

      - name: Install dependencies with caching
        uses: ./.github/actions/install-deps
        with:
          os: ubuntu
          extra-packages: valgrind
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache build, dependencies, and ccache
        id: cache-build
        uses: ./.github/actions/cache-build
        with:
          cache-version: v7

      - name: Clean test executables and libraries only
        run: |
          # Only clean test executables and old libraries
          # Keep CMakeCache.txt and CMakeFiles to preserve configure cache
          rm -rf build/bin/test_*
          rm -rf build/lib/*.a

      - name: Configure with AddressSanitizer
        run: |
          # Use CMake build system with AddressSanitizer
          FLAGS="-std=c2x -fsanitize=address"

          # The restored build cache may come from a static musl release build.
          # Start from a clean configure so sanitizer builds use the host libc.
          rm -rf build/
          cmake -B build --preset github \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="${FLAGS}"

      - name: Save configure cache (memory-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Build with AddressSanitizer
        run: |
          cmake --build build --target ascii-chat

      - name: Run memory leak detection
        run: |
          echo "Testing binary memory usage..."
          # NOTE: THese are started with "&" and run in the background with no logs.
          timeout 10s valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes \
            ./build/bin/ascii-chat server > valgrind-server.log 2>&1 &
          SERVER_PID=$!
          # Run server in the background so the command doesn't block until the process is dead so we can start the client.
          timeout 10s valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes \
            ./build/bin/ascii-chat client --test-pattern > valgrind-client.log 2>&1 &
          CLIENT_PID=$!
          # Wait for both processes - timeout exit code 124 is expected (processes ran for full duration)
          wait $SERVER_PID || true
          wait $CLIENT_PID || true

      - name: Analyze memory reports
        run: |
          echo "=== Binary Memory Analysis ==="
          if grep -q "definitely lost" valgrind-*.log; then
            echo "❌ Memory leaks detected"
            grep "definitely lost" valgrind-*.log
          else
            echo "✅ No memory leaks detected"
          fi

      - name: Save build cache (memory-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Upload memory test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-test-results
          path: |
            valgrind-*.log
          retention-days: 7

  functional-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          submodules: true

      - name: Install dependencies with caching
        uses: ./.github/actions/install-deps
        with:
          os: ${{ startsWith(matrix.os, 'ubuntu') && 'ubuntu' || 'macos' }}
          extra-packages: ${{ startsWith(matrix.os, 'macos') && 'coreutils' || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache build, dependencies, and ccache
        id: cache-build
        uses: ./.github/actions/cache-build
        with:
          cache-version: v7

      - name: Clean test executables and libraries only
        run: |
          # Only clean test executables and old libraries
          # Keep CMakeCache.txt and CMakeFiles to preserve configure cache
          rm -rf build/bin/test_*
          rm -rf build/lib/*.a

      - name: Configure project
        run: |
          # Use CMake build system
          # Use Homebrew LLVM on macOS for better standards support
          # Detect Homebrew prefix (ARM Mac uses /opt/homebrew, Intel uses /usr/local)
          if [ "${{ startsWith(matrix.os, 'macos') && 'macos' || 'ubuntu' }}" = "macos" ]; then
            if [ -d "/opt/homebrew/opt/llvm" ]; then
              HOMEBREW_PREFIX="/opt/homebrew"
            elif [ -d "/usr/local/opt/llvm" ]; then
              HOMEBREW_PREFIX="/usr/local"
            else
              echo "Error: Homebrew LLVM not found at /opt/homebrew or /usr/local"
              exit 1
            fi
            CLANG_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang"
            CLANGXX_BIN="${HOMEBREW_PREFIX}/opt/llvm/bin/clang++"
            echo "Using Homebrew LLVM from: ${HOMEBREW_PREFIX}/opt/llvm"
          else
            CLANG_BIN="clang"
            CLANGXX_BIN="clang++"
          fi

          FLAGS="-std=c2x"

          # Disable coverage for functional tests - not needed and causes llvm_gcov_init symbol errors
          cmake -B build --preset github \
            -DCMAKE_C_COMPILER="${CLANG_BIN}" -DCMAKE_CXX_COMPILER="${CLANGXX_BIN}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="${FLAGS}" \
            -DBUILD_TESTS=OFF \
            -DASCIICHAT_ENABLE_COVERAGE=OFF

      - name: Save configure cache (functional-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}

      - name: Build project
        run: |
          cmake --build build

      - name: Test binary help and modes
        env:
          TERM: xterm-256color
        run: |
          # Set TERM for terminal detection in CI environment
          # Test binary help
          ./build/bin/ascii-chat --help
          ./build/bin/ascii-chat server --help
          ./build/bin/ascii-chat client --help
          # Test basic server startup (short timeout)
          timeout 2s ./build/bin/ascii-chat server --log-file /tmp/server_test.log || true
          echo "Binary help and mode tests passed"

      - name: Test client capabilities
        env:
          TERM: xterm-256color
        run: |
          # Test client capabilities detection
          ./build/bin/ascii-chat client --show-capabilities
          echo "✅ Client capability detection test passed"

      - name: Save build cache (functional-tests)
        if: always()
        uses: ./.github/actions/cache-build-save
        with:
          build-directory: ${{ steps.cache-build.outputs['build-directory-path'] }}
          configure-cache-key: ${{ steps.cache-build.outputs['configure-cache-key'] }}
          configure-cache-hit: ${{ steps.cache-build.outputs['configure-cache-hit'] }}
          build-cache-key: ${{ steps.cache-build.outputs['build-cache-key'] }}
          build-cache-hit: ${{ steps.cache-build.outputs['build-cache-hit'] }}
          cache-deps-enabled: ${{ steps.cache-build.outputs['cache-deps-enabled'] }}
          deps-cache-directory: ${{ steps.cache-build.outputs['deps-cache-path'] }}
          deps-cache-key: ${{ steps.cache-build.outputs['deps-cache-key'] }}
          deps-cache-hit: ${{ steps.cache-build.outputs['deps-cache-hit'] }}
          cache-ccache-enabled: ${{ steps.cache-build.outputs['cache-ccache-enabled'] }}
          ccache-directory: ${{ steps.cache-build.outputs['ccache-directory-path'] }}
          ccache-cache-key: ${{ steps.cache-build.outputs['ccache-cache-key'] }}
          ccache-cache-hit: ${{ steps.cache-build.outputs['ccache-cache-hit'] }}
