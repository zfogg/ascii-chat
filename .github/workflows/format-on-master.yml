name: Format code on master

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-master
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install latest LLVM tools
        run: |
          # Official installer from https://apt.llvm.org/
          wget -O llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build clang-format
          rm -f llvm.sh

      - name: Format authored C sources
        shell: bash
        run: |
          git ls-files -z -- 'src/**/*.c' 'src/**/*.h' 'lib/**/*.c' 'lib/**/*.h' 'src/*.c' 'src/*.h' 'lib/*.c' 'lib/*.h' \
            | xargs -0 --no-run-if-empty clang-format -i

      - name: Commit and push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git add --all
          git rm --cached --ignore-unmatch llvm.sh
          git commit -m "style: format code with clang-format [skip ci]"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort
              echo "A rebase conflict requires manual resolution."
              exit 1
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Remote changed during push; retrying."
            sleep $((attempt * 2))
          done
          echo "Could not push after 5 attempts."
          exit 1
