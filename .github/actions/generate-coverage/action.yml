name: "Generate Coverage Report"
description: "Merge Clang execution counters into a validated Cobertura report"
inputs:
  os-type:
    description: "Operating system type (macos or ubuntu)"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install coverage reporter
      shell: bash
      run: python -m pip install gcovr==8.6
    - name: Generate merged coverage report
      shell: bash
      run: python3 .github/scripts/generate-coverage.py
