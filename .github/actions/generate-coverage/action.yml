name: "Generate Coverage Report"
description: "Merge Clang execution counters into a validated Cobertura report"
inputs:
  os-type:
    description: "Operating system type (macos or ubuntu)"
    required: true
runs:
  using: "composite"
  steps:
    - name: Generate merged coverage report
      shell: bash
      run: python3 .github/scripts/generate-coverage.py
