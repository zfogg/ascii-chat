version: 1
id: 88bde04f-fc8e-4ae6-ae10-7aaa76ede1e3
name: ascii-chat · Session health
description: Last 15 minutes of observations across ascii-chat services. Totals and histogram summaries use only the newest cumulative snapshot per series and process start. They are
  process-lifetime totals for processes seen in this window, not interval counts. Missing telemetry is not zero. Hidden-screen drops are expected; sampling does not affect metric counts.
magic_variables:
- name: session_id
  kind: string
panels:
- title: Unique call session strings (15m)
  display_type: single_value
  query: SELECT unique_session_strings AS value FROM (WITH used AS (SELECT service_name,json_extract_string(attributes,'$."ascii-chat.session.string"') AS session_string FROM spans WHERE
    service_name IN ('ascii-chat-discovery','ascii-chat-discovery-service') AND name='ascii-chat.discovery.call.session_used' AND start_ns >= epoch_ns(current_timestamp)-900000000000)
    SELECT count(DISTINCT session_string) AS unique_session_strings,count(DISTINCT session_string) FILTER (WHERE service_name='ascii-chat-discovery') AS connected_session_strings,count(DISTINCT
    session_string) FILTER (WHERE service_name='ascii-chat-discovery-service') AS joined_session_strings FROM used WHERE session_string IS NOT NULL AND session_string<>'') AS counts
  settings: {}
  layout:
    w: 4
    h: 1
  position: 0
- title: Connected session strings (15m)
  display_type: single_value
  query: SELECT connected_session_strings AS value FROM (WITH used AS (SELECT service_name,json_extract_string(attributes,'$."ascii-chat.session.string"') AS session_string FROM spans
    WHERE service_name IN ('ascii-chat-discovery','ascii-chat-discovery-service') AND name='ascii-chat.discovery.call.session_used' AND start_ns >= epoch_ns(current_timestamp)-900000000000)
    SELECT count(DISTINCT session_string) AS unique_session_strings,count(DISTINCT session_string) FILTER (WHERE service_name='ascii-chat-discovery') AS connected_session_strings,count(DISTINCT
    session_string) FILTER (WHERE service_name='ascii-chat-discovery-service') AS joined_session_strings FROM used WHERE session_string IS NOT NULL AND session_string<>'') AS counts
  settings: {}
  layout:
    w: 4
    h: 1
  position: 1
- title: Joined session strings (15m)
  display_type: single_value
  query: SELECT joined_session_strings AS value FROM (WITH used AS (SELECT service_name,json_extract_string(attributes,'$."ascii-chat.session.string"') AS session_string FROM spans WHERE
    service_name IN ('ascii-chat-discovery','ascii-chat-discovery-service') AND name='ascii-chat.discovery.call.session_used' AND start_ns >= epoch_ns(current_timestamp)-900000000000)
    SELECT count(DISTINCT session_string) AS unique_session_strings,count(DISTINCT session_string) FILTER (WHERE service_name='ascii-chat-discovery') AS connected_session_strings,count(DISTINCT
    session_string) FILTER (WHERE service_name='ascii-chat-discovery-service') AS joined_session_strings FROM used WHERE session_string IS NOT NULL AND session_string<>'') AS counts
  settings: {}
  layout:
    w: 4
    h: 1
  position: 2
- title: Capture, display and frame-drop totals
  display_type: entity_list
  query: SELECT service_name || ' / ' || name AS label,process_total AS primary_value FROM (WITH latest AS (SELECT * FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')
    AND timestamp_ns >= epoch_ns(current_timestamp) - 900000000000 QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key ORDER BY timestamp_ns DESC)=1)
    SELECT service_name,name,sum(value) AS process_total FROM latest WHERE name LIKE 'ascii-chat.frames.%' AND type='sum' GROUP BY service_name,name ORDER BY service_name,name) AS totals
  settings: {}
  layout:
    w: 6
    h: 1
  position: 3
- title: Pipeline and queue latency (cumulative mean, ms)
  display_type: time_series
  query: WITH snapshots AS (SELECT *,floor(timestamp_ns/10000000000)*10 AS bucket FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')
    AND timestamp_ns>=epoch_ns(current_timestamp)-900000000000 AND (type='histogram' AND (name IN ('ascii-chat.frames.capture_to_display','ascii-chat.frames.capture_to_encode','ascii-chat.queue.display.wait','ascii-chat.queue.encode.wait','ascii-chat.queue.oldest_age')))
    QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key,bucket ORDER BY timestamp_ns DESC)=1) SELECT to_timestamp(bucket) AS timestamp,service_name
    || ' / ' || name AS series,1000*sum(histogram_sum)/nullif(sum(histogram_count),0) AS value FROM snapshots GROUP BY bucket,service_name,name ORDER BY bucket,service_name,name
  settings: {}
  layout:
    w: 6
    h: 1
  position: 4
- title: Audio underruns, overruns, clipped and dropped samples
  display_type: entity_list
  query: SELECT service_name || ' / ' || name AS label,process_total AS primary_value FROM (WITH latest AS (SELECT * FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')
    AND timestamp_ns >= epoch_ns(current_timestamp) - 900000000000 QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key ORDER BY timestamp_ns DESC)=1)
    SELECT service_name,name,sum(value) AS process_total FROM latest WHERE name IN ('ascii-chat.audio.underruns','ascii-chat.audio.overruns','ascii-chat.audio.samples.dropped','ascii-chat.audio.samples.clipped')
    GROUP BY service_name,name ORDER BY service_name,name) AS totals
  settings: {}
  layout:
    w: 6
    h: 1
  position: 5
- title: RTT and outbound queue age (cumulative mean, ms)
  display_type: time_series
  query: WITH snapshots AS (SELECT *,floor(timestamp_ns/10000000000)*10 AS bucket FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')
    AND timestamp_ns>=epoch_ns(current_timestamp)-900000000000 AND (type='histogram' AND (name IN ('ascii-chat.network.round_trip_time','ascii-chat.network.outbound.oldest_age'))) QUALIFY
    row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key,bucket ORDER BY timestamp_ns DESC)=1) SELECT to_timestamp(bucket) AS timestamp,service_name || ' /
    ' || name AS series,1000*sum(histogram_sum)/nullif(sum(histogram_count),0) AS value FROM snapshots GROUP BY bucket,service_name,name ORDER BY bucket,service_name,name
  settings: {}
  layout:
    w: 6
    h: 1
  position: 6
- title: Network errors, reconnects and bytes
  display_type: entity_list
  query: SELECT service_name || ' / ' || name AS label,process_total AS primary_value FROM (WITH latest AS (SELECT * FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')
    AND timestamp_ns >= epoch_ns(current_timestamp) - 900000000000 QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key ORDER BY timestamp_ns DESC)=1)
    SELECT service_name,name,sum(value) AS process_total FROM latest WHERE name IN ('ascii-chat.network.reconnects','ascii-chat.network.disconnects','ascii-chat.network.send.errors','ascii-chat.network.receive.errors','ascii-chat.network.sent','ascii-chat.network.received','ascii-chat.network.outbound.frames.dropped','ascii-chat.network.outbound.congestion')
    GROUP BY service_name,name ORDER BY service_name,name) AS totals
  settings: {}
  layout:
    w: 6
    h: 1
  position: 7
- title: Latest queue occupancy and active connections
  display_type: time_series
  query: WITH snapshots AS (SELECT *,floor(timestamp_ns/10000000000)*10 AS bucket FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')
    AND timestamp_ns>=epoch_ns(current_timestamp)-900000000000 AND (name IN ('ascii-chat.queue.display.depth','ascii-chat.queue.encode.depth','ascii-chat.network.connections.active'))
    QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key,bucket ORDER BY timestamp_ns DESC)=1) SELECT to_timestamp(bucket) AS timestamp,service_name
    || ' / ' || name AS series,max(value) AS value FROM snapshots GROUP BY bucket,service_name,name ORDER BY bucket,service_name,name
  settings: {}
  layout:
    w: 6
    h: 1
  position: 8
- title: Capture-to-display mean latency trend (cumulative observations, ms)
  display_type: time_series
  query: WITH snapshots AS (SELECT *, floor(timestamp_ns/10000000000)*10 AS bucket FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')
    AND timestamp_ns >= epoch_ns(current_timestamp)-900000000000 AND name='ascii-chat.frames.capture_to_display' QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key,bucket
    ORDER BY timestamp_ns DESC)=1) SELECT to_timestamp(bucket) AS timestamp,service_name AS series,1000*sum(histogram_sum)/nullif(sum(histogram_count),0) AS value FROM snapshots GROUP
    BY bucket,service_name ORDER BY bucket
  settings: {}
  layout:
    w: 6
    h: 1
  position: 9
