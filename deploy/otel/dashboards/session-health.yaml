- title: Invalid ASCII frames by reason (retained error spans)
  display_type: heatmap
  query: "SELECT floor(start_ns/10000000000)*10000000000 AS timestamp_ns,\n coalesce(json_extract_string(attributes,'$.\"frame.validation.reason\"'),'unknown')\
    \ AS y,count(*) AS value\n FROM spans WHERE session_id=$session_id AND service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')\
    \ AND name='ascii-chat.frame.validation.rejected'\n AND start_ns>=coalesce(greatest((SELECT max(timestamp_ns) FROM metrics WHERE session_id=$session_id),(SELECT\
    \ max(end_ns) FROM spans WHERE session_id=$session_id),(SELECT max(timestamp_ns) FROM logs WHERE session_id=$session_id)),epoch_ns(current_timestamp))-900000000000\
    \ GROUP BY 1,2 ORDER BY 1,2"
  settings: {}
  layout:
    w: 6
    h: 1
  position: 15
- title: Dropped and clipped audio sample totals
  display_type: bar
  query: SELECT service_name || ' / ' || name AS label,process_total AS value FROM (WITH latest AS (SELECT * FROM metrics WHERE session_id=$session_id AND service_name
    IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service') AND timestamp_ns >= coalesce(greatest((SELECT
