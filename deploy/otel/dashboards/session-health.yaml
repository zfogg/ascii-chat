- title: Frame stage throughput (frames/s)
  display_type: time_series
  query: "WITH points AS (\n SELECT * FROM metrics WHERE session_id=$session_id AND service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')\n\
    \ AND type='sum' AND name IN ('ascii-chat.frames.captured','ascii-chat.frames.converted','ascii-chat.frames.submitted_to_display','ascii-chat.frames.presented','ascii-chat.recording.frames.encoded')\
    \ AND timestamp_ns >= coalesce(greatest((SELECT max(timestamp_ns) FROM metrics WHERE session_id=$session_id),(SELECT max(end_ns) FROM spans WHERE session_id=$session_id),(SELECT\
    \ max(timestamp_ns) FROM logs WHERE session_id=$session_id)),epoch_ns(current_timestamp))-960000000000\n QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key,timestamp_ns\
    \ ORDER BY timestamp_ns DESC)=1\n), deltas AS (\n SELECT *,lag(value) OVER w AS previous,lag(timestamp_ns) OVER w AS previous_ns FROM points\n WINDOW w AS\
    \ (PARTITION BY service_name,name,start_timestamp_ns,series_key ORDER BY timestamp_ns)\n), per_process AS (\n SELECT floor(timestamp_ns/10000000000)*10000000000\
    \ AS timestamp_ns,service_name,name,start_timestamp_ns,series_key,\n sum(value-previous)/nullif(sum((timestamp_ns-previous_ns)/1e9),0)/1 AS value\n FROM\
    \ deltas WHERE previous IS NOT NULL AND value>=previous AND timestamp_ns>previous_ns\n AND timestamp_ns>=coalesce(greatest((SELECT max(timestamp_ns) FROM\
    \ metrics WHERE session_id=$session_id),(SELECT max(end_ns) FROM spans WHERE session_id=$session_id),(SELECT max(timestamp_ns) FROM logs WHERE session_id=$session_id)),epoch_ns(current_timestamp))-900000000000\n\
    \ GROUP BY 1,service_name,name,start_timestamp_ns,series_key\n)\nSELECT timestamp_ns,service_name || ' / ' || name AS group_value,sum(value) AS value\nFROM\
    \ per_process GROUP BY timestamp_ns,service_name,name ORDER BY timestamp_ns,service_name,name"
  settings: {}
  layout:
    w: 6
    h: 1
  position: 10
