    logs WHERE session_id=$session_id)),epoch_ns(current_timestamp)) - 900000000000 QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key
    ORDER BY timestamp_ns DESC)=1) SELECT service_name,name,sum(value) AS process_total FROM latest WHERE name IN ('ascii-chat.audio.samples.dropped','ascii-chat.audio.samples.clipped')
    GROUP BY service_name,name ORDER BY service_name,name) AS totals
  settings:
    unit: samples
  layout: *id001
