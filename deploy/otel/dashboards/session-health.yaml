- title: Rejected frame validations (%)
  display_type: gauge
  query: "WITH latest AS (SELECT * FROM metrics WHERE session_id=$session_id AND service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service')\n\
    \ AND name IN ('ascii-chat.frame.validation.checked','ascii-chat.frame.validation.rejected') AND timestamp_ns>=coalesce(greatest((SELECT max(timestamp_ns)\
    \ FROM metrics WHERE session_id=$session_id),(SELECT max(end_ns) FROM spans WHERE session_id=$session_id),(SELECT max(timestamp_ns) FROM logs WHERE session_id=$session_id)),epoch_ns(current_timestamp))-900000000000\n\
    \ QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key ORDER BY timestamp_ns DESC)=1) SELECT 100.0*sum(CASE WHEN name='ascii-chat.frame.validation.rejected'\
    \ THEN value ELSE 0 END)\n /nullif(sum(CASE WHEN name='ascii-chat.frame.validation.checked' THEN value ELSE 0 END),0) AS value FROM latest"
  settings:
    min: 0
    max: 100
    unit: '%'
  layout:
    w: 6
    h: 1
  position: 17
