version: 1
id: ascii-chat-invalid-frames
name: ascii-chat · Invalid or failed frame conversion
query: |-
    WITH points AS (
      SELECT * FROM metrics WHERE service_name IN ('ascii-chat-server','ascii-chat-client','ascii-chat-mirror','ascii-chat-discovery','ascii-chat-discovery-service') AND timestamp_ns >= epoch_ns(current_timestamp)-600000000000 AND name IN ('ascii-chat.frames.dropped.invalid','ascii-chat.frames.dropped.conversion')
      QUALIFY row_number() OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key,timestamp_ns ORDER BY timestamp_ns DESC)=1
    ), changes AS (
      SELECT *,lag(value) OVER (PARTITION BY service_name,name,start_timestamp_ns,series_key ORDER BY timestamp_ns) AS previous
      FROM points
    )
    SELECT service_name,sum(CASE WHEN previous IS NOT NULL THEN greatest(value-previous,0)
      WHEN start_timestamp_ns >= epoch_ns(current_timestamp)-300000000000 THEN greatest(value,0) ELSE 0 END) AS value
    FROM changes WHERE timestamp_ns >= epoch_ns(current_timestamp)-300000000000 GROUP BY service_name
condition:
    kind: threshold
    operator: '>='
    threshold: 5
group_by:
    - service_name
pending_for: 30s
cooldown: 10m0s
repeat_interval: 1h0m0s
severity: warning
enabled: true
browser_enabled: true
pushover_enabled: false
annotations:
    runbook: Inspect decoder and frame-conversion errors, dimensions and codec compatibility. Expected screen_hidden, display_replaced, encode_timeout and congestion drops are intentionally excluded.
    summary: At least five invalid-frame or conversion drops occurred in the last five minutes.
