name: ascii-chat-otel
services:
  spaniel:
    image: ${SPANIEL_IMAGE:-spaniel:query-diagnostics-1325fa3}
    command: ["--db-path", "/data/spaniel.duckdb", "--no-browser", "--mcp-allow-writes", "--dashboards-dir", "/dashboards", "--alerts-dir", "/alerts"]
    environment:
      SPANIEL_BIND_ADDRESS_V4: 0.0.0.0
      SPANIEL_BIND_ADDRESS_V6: "::"
      SPANIEL_SELF_MONITOR: "false"
    ports:
      - "127.0.0.1:28080:8080"
      - "127.0.0.1:24318:4318"
    volumes:
      - spaniel-data:/data
      - ./dashboards:/dashboards
      - ./alerts:/alerts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  spaniel-data:
