  - title: Application packet and media-frame throughput (events/s)
    display_type: time_series
    query: |
      WITH points AS (
        SELECT
          *
        FROM metrics
        WHERE
          session_id = $session_id
          AND service_name IN (
            'ascii-chat-server',
            'ascii-chat-client',
            'ascii-chat-mirror',
            'ascii-chat-discovery',
            'ascii-chat-discovery-service'
          )
          AND type = 'sum'
          AND name IN (
            'ascii-chat.network.packets.sent',
            'ascii-chat.network.packets.received',
            'ascii-chat.frames.sent',
            'ascii-chat.frames.received'
          )
          AND timestamp_ns >= coalesce(
            greatest(
              (
                SELECT
                  max(timestamp_ns)
                FROM metrics
                WHERE
                  session_id = $session_id
              ),
              (
                SELECT
                  max(end_ns)
                FROM spans
                WHERE
                  session_id = $session_id
              ),
              (
                SELECT
                  max(timestamp_ns)
                FROM logs
                WHERE
                  session_id = $session_id
              )
            ),
            epoch_ns(current_timestamp)
          ) - 960000000000
        QUALIFY
          row_number() OVER (
            PARTITION BY
              service_name,
              name,
              start_timestamp_ns,
              series_key,
              timestamp_ns
            ORDER BY timestamp_ns DESC
          ) = 1
      ),
      deltas AS (
        SELECT
          *,
          lag(value) OVER w AS previous,
          lag(timestamp_ns) OVER w AS previous_ns
        FROM points WINDOW w AS (
          PARTITION BY service_name,
          name,
          start_timestamp_ns,
          series_key ORDER BY timestamp_ns
        )
      ),
      per_process AS (
        SELECT
          floor(timestamp_ns / 10000000000) * 10000000000 AS timestamp_ns,
          service_name,
          name,
          start_timestamp_ns,
          series_key,
          sum(value - previous) / nullif(sum((timestamp_ns - previous_ns) / 1e9), 0) / 1 AS value
        FROM deltas
        WHERE
          previous IS NOT NULL
          AND value >= previous
          AND timestamp_ns > previous_ns
          AND timestamp_ns >= coalesce(
            greatest(
              (
                SELECT
                  max(timestamp_ns)
                FROM metrics
                WHERE
                  session_id = $session_id
              ),
              (
                SELECT
                  max(end_ns)
                FROM spans
                WHERE
                  session_id = $session_id
              ),
              (
                SELECT
                  max(timestamp_ns)
                FROM logs
                WHERE
                  session_id = $session_id
              )
            ),
            epoch_ns(current_timestamp)
          ) - 900000000000
        GROUP BY
          1,
          service_name,
          name,
          start_timestamp_ns,
          series_key
      )
      SELECT
        timestamp_ns,
        service_name || ' / ' || name AS group_value,
        sum(value) AS value
      FROM per_process
      GROUP BY
        timestamp_ns,
        service_name,
        name
      ORDER BY
        timestamp_ns,
        service_name,
        name
    settings: {}
    layout:
      w: 6
      h: 1
    position: 4
