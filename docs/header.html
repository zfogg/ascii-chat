<!-- HTML header for doxygen 1.15.0-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="$langISO">
  <head>
    <meta http-equiv="Content-Type" content="text/xhtml;charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=11" />
    <meta name="generator" content="Doxygen $doxygenversion" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--BEGIN PROJECT_NAME-->
    <title>$projectname: $title</title>
    <!--END PROJECT_NAME-->
    <!--BEGIN !PROJECT_NAME-->
    <title>$title</title>
    <!--END !PROJECT_NAME-->
    <!--BEGIN PROJECT_ICON-->
    <link rel="icon" href="$relpath^$projecticon" type="image/x-icon" />
    <!--END PROJECT_ICON-->
    <link href="$relpath^tabs.css" rel="stylesheet" type="text/css" />
    <!--BEGIN FULL_SIDEBAR-->
    <script type="text/javascript">
      var page_layout = 1;
    </script>
    <!--END FULL_SIDEBAR-->
    <script type="text/javascript" src="$relpath^jquery.js"></script>
    <script type="text/javascript" src="$relpath^dynsections.js"></script>
    <!--BEGIN COPY_CLIPBOARD-->
    <script type="text/javascript" src="$relpath^clipboard.js"></script>
    <!--END COPY_CLIPBOARD-->
    $treeview $search $mathjax $darkmode
    <link href="$relpath^$stylesheet" rel="stylesheet" type="text/css" />
    $extrastylesheet

    <!-- doxygen-awesome-css extensions -->
    <script
      type="text/javascript"
      src="$relpath^doxygen-awesome-darkmode-toggle.js"
    ></script>
    <script
      type="text/javascript"
      src="$relpath^doxygen-awesome-fragment-copy-button.js"
    ></script>
    <script
      type="text/javascript"
      src="$relpath^doxygen-awesome-paragraph-link.js"
    ></script>
    <script
      type="text/javascript"
      src="$relpath^doxygen-awesome-interactive-toc.js"
    ></script>
    <script type="text/javascript">
      // Doxygen 1.18 no longer emits jquery.js, while the upstream toggle
      // still uses its ready/resize wrapper. Initialize the same control with
      // native DOM events so the theme switch remains usable.
      document.addEventListener("DOMContentLoaded", function () {
        function addThemeToggle() {
          var searchBox = document.getElementById("MSearchBox");
          if (
            !searchBox ||
            document.querySelector("doxygen-awesome-dark-mode-toggle")
          ) {
            return;
          }
          var toggleButton = document.createElement(
            "doxygen-awesome-dark-mode-toggle",
          );
          toggleButton.title = DoxygenAwesomeDarkModeToggle.title;
          toggleButton.updateIcon();
          searchBox.parentNode.appendChild(toggleButton);
        }
        addThemeToggle();
        window.addEventListener("resize", addThemeToggle);
      });
      DoxygenAwesomeFragmentCopyButton.init();
      DoxygenAwesomeParagraphLink.init();
      DoxygenAwesomeInteractiveToc.init();

      // Doxygen includes custom user tabs in menudata.js, but not in the
      // sidebar-only nav tree. Keep the curated Topic Categories index at the
      // root of the sidebar alongside Topics, Files, and Examples.
      document.addEventListener("DOMContentLoaded", function () {
        function addTopicCategories() {
          var nav = document.querySelector("#nav-tree-contents ul");
          if (
            !nav ||
            nav.querySelector('a[href="group__topic__categories.html"]')
          ) {
            return !!nav;
          }

          var topics = nav.querySelector('a[href="topics.html"]');
          if (!topics) {
            return false;
          }

          var item = document.createElement("li");
          item.className = topics.parentElement.parentElement.className;
          item.innerHTML =
            '<a class="el" href="group__topic__categories.html">Topic Categories</a>';
          topics.parentElement.parentElement.insertAdjacentElement(
            "afterend",
            item,
          );
          return true;
        }

        if (!addTopicCategories()) {
          var observer = new MutationObserver(function () {
            if (addTopicCategories()) {
              observer.disconnect();
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }
      });
    </script>
  </head>
  <body>
    <!--BEGIN FULL_SIDEBAR-->
    <div id="side-nav" class="ui-resizable side-nav-resizable">
      <!-- do not remove this div, it is closed by doxygen! -->
      <!--END FULL_SIDEBAR-->

      <div id="top">
        <!-- do not remove this div, it is closed by doxygen! -->

        <!--BEGIN TITLEAREA-->
        <div id="titlearea">
          <table cellspacing="0" cellpadding="0">
            <tbody>
              <tr id="projectrow">
                <!--BEGIN PROJECT_LOGO-->
                <td id="projectlogo">
                  <img alt="Logo" src="$relpath^$projectlogo" $logosize />
                </td>
                <!--END PROJECT_LOGO-->
                <!--BEGIN PROJECT_NAME-->
                <td id="projectalign">
                  <div id="projectname">
                    $projectname<!--BEGIN PROJECT_NUMBER--><span
                      id="projectnumber"
                      >&#160;$projectnumber</span
                    ><!--END PROJECT_NUMBER-->
                  </div>
                  <!--BEGIN PROJECT_BRIEF-->
                  <div id="projectbrief">$projectbrief</div>
                  <!--END PROJECT_BRIEF-->
                </td>
                <!--END PROJECT_NAME-->
                <!--BEGIN !PROJECT_NAME-->
                <!--BEGIN PROJECT_BRIEF-->
                <td>
                  <div id="projectbrief">$projectbrief</div>
                </td>
                <!--END PROJECT_BRIEF-->
                <!--END !PROJECT_NAME-->
                <!--BEGIN DISABLE_INDEX-->
                <!--BEGIN SEARCHENGINE-->
                <!--BEGIN !FULL_SIDEBAR-->
                <td>$searchbox</td>
                <!--END !FULL_SIDEBAR-->
                <!--END SEARCHENGINE-->
                <!--END DISABLE_INDEX-->
              </tr>
              <!--BEGIN SEARCHENGINE-->
              <!--BEGIN FULL_SIDEBAR-->
              <tr>
                <td colspan="2">$searchbox</td>
              </tr>
              <!--END FULL_SIDEBAR-->
              <!--END SEARCHENGINE-->
            </tbody>
          </table>
        </div>
        <!--END TITLEAREA-->
        <!-- end header part -->
      </div>
    </div>
  </body>
</html>
