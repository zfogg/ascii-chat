<!doctype html><meta charset="utf-8" /><title>
  C / Canvas test pattern parity
</title>
<style>
  body {
    margin: 20px;
    background: #151515;
    color: white;
    font: 16px sans-serif;
  }
  section {
    display: flex;
    gap: 16px;
  }
  canvas {
    max-width: 46vw;
    object-fit: contain;
  }
  h2 {
    font-size: 16px;
  }
</style>
<h1>C/WASM and Canvas reference</h1>
<section>
  <div>
    <h2>Canvas reference</h2>
    <canvas id="reference"></canvas>
  </div>
  <div>
    <h2>C / WASM</h2>
    <canvas id="actual"></canvas>
  </div>
</section>
<script type="module">
  import factory from "/src/wasm/dist/mirror.js";
  import { adoptMirrorWasmModule } from "../../../../packages/shared/src/wasm/mirror.ts";
  import {
    drawSelectedTestPatternFrame,
    releaseTestPatternFrame,
  } from "../../../../packages/shared/src/testPattern.ts";
  import {
    drawTestPatternFrame,
    drawTestPatternFrame2,
  } from "./test-pattern-reference.ts";
  const module = await factory({ locateFile: (path) => "/wasm/" + path });
  adoptMirrorWasmModule(module);
  const font = new FontFace(
    "PatternLabel",
    module.HEAPU8.slice(
      module._get_font_default_ptr(),
      module._get_font_default_ptr() + module._get_font_default_size(),
    ).buffer,
  );
  await font.load();
  document.fonts.add(font);
  window.patternModule = module;
  window.comparePattern = (
    index,
    width,
    height,
    time,
    cadence = false,
    originalFont = false,
  ) => {
    const ref = document.querySelector("#reference"),
      actual = document.querySelector("#actual");
    ref.width = actual.width = width;
    ref.height = actual.height = height;
    const r = ref.getContext("2d", { willReadFrequently: true }),
      a = actual.getContext("2d", { willReadFrequently: true });
    const fillText = r.fillText.bind(r);
    // Font normalization is explicit: native builds cannot rely on an OS sans-serif face.
    r.fillText = (text, x, y) => {
      if (!originalFont) r.font = r.font.replace("sans-serif", "PatternLabel");
      fillText(text, x, y);
    };
    (index ? drawTestPatternFrame2 : drawTestPatternFrame)(
      r,
      width,
      height,
      time,
      cadence,
    );
    r.fillText = fillText;
    drawSelectedTestPatternFrame(
      index ? "test2" : "test",
      a,
      width,
      height,
      time,
      cadence,
    );
    const expected = r.getImageData(0, 0, width, height).data,
      result = a.getImageData(0, 0, width, height).data;
    let error = 0,
      changed = 0,
      geometryError = 0,
      geometryCount = 0;
    for (let i = 0; i < expected.length; i += 4) {
      let max = 0;
      for (let c = 0; c < 3; c++) {
        const d = Math.abs(expected[i + c] - result[i + c]);
        error += d;
        max = Math.max(max, d);
      }
      if (max > 8) changed++;
      const y = Math.floor(i / 4 / width);
      if (y > Math.max(36, height / 8) + 2) {
        for (let c = 0; c < 3; c++)
          geometryError += Math.abs(expected[i + c] - result[i + c]);
        geometryCount += 3;
      }
    }
    return {
      meanError: error / (width * height * 3),
      changedFraction: changed / (width * height),
      geometryError: geometryError / geometryCount,
    };
  };
  window.releasePattern = () =>
    releaseTestPatternFrame(document.querySelector("#actual").getContext("2d"));
  window.benchmarkPatterns = async () => {
    const canvas = document.createElement("canvas");
    canvas.width = 1920;
    canvas.height = 1080;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const samples = [];
    for (const index of [0, 1])
      for (const cadence of [false, true]) {
        if (!index && cadence) continue;
        const cTimes = [],
          jsTimes = [];
        for (let i = 0; i < 60; i++) {
          await new Promise(requestAnimationFrame);
          let start = performance.now();
          drawSelectedTestPatternFrame(
            index ? "test2" : "test",
            ctx,
            1920,
            1080,
            (i * 1000) / 60,
            cadence,
          );
          cTimes.push(performance.now() - start);
          start = performance.now();
          (index ? drawTestPatternFrame2 : drawTestPatternFrame)(
            ctx,
            1920,
            1080,
            (i * 1000) / 60,
            cadence,
          );
          ctx.getImageData(0, 0, 1920, 1080);
          jsTimes.push(performance.now() - start);
        }
        const summarize = (xs) => {
          xs = xs.slice(5).sort((a, b) => a - b);
          return {
            median: xs[Math.floor(xs.length / 2)],
            p95: xs[Math.floor(xs.length * 0.95)],
          };
        };
        samples.push({
          index,
          cadence,
          c: summarize(cTimes),
          canvas: summarize(jsTimes),
        });
      }
    releaseTestPatternFrame(ctx);
    return samples;
  };
  window.ready = true;
</script>
