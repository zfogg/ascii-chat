<!doctype html><meta charset="utf-8" /><title>
  Block raster regression test
</title>
<pre id="status">Running...</pre>
<script type="module">
  const assert = {
    equal(a, b, message) {
      if (a !== b) throw Error(message || `${a} != ${b}`);
    },
    deepEqual(a, b, message) {
      this.equal(JSON.stringify(a), JSON.stringify(b), message);
    },
  };
  import factory from "/wasm/mirror.js";
  const m = await factory({ print() {}, printErr() {} });
  const r = new m.AsciiRendererBinding(2, 2, 12, false, 0);
  assert.equal(r.valid(), true);
  const { width: w, height: h } = r.dimensions();
  for (const glyph of ["▀", "▄", "█"]) {
    const frame = `\x1b[38;2;255;0;0m\x1b[48;2;0;0;255m${glyph.repeat(2)}\n${glyph.repeat(2)}`;
    for (let pass = 0; pass < 2; pass++) {
      const pixels = r.render(frame, 0);
      assert.equal(Boolean(pixels), true);
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          const upper = y % (h / 2) < Math.floor(h / 4);
          const red = glyph === "█" || (glyph === "▀" ? upper : !upper);
          assert.deepEqual(
            Array.from(pixels.subarray((y * w + x) * 4, (y * w + x) * 4 + 4)),
            red ? [255, 0, 0, 255] : [0, 0, 255, 255],
            `${glyph} pass ${pass} pixel ${x},${y}`,
          );
        }
    }
  }
  r.delete();
  document.querySelector("#status").textContent =
    `PASS: upper/lower/full blocks cover every pixel (${w}x${h}), including cached frames`;
</script>
