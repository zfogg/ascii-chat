<!doctype html>
<meta charset="utf-8" />
<title>WASM ANSI-16 renderer test</title>
<style>
  body {
    margin: 24px;
    background: #10131a;
    color: #e6e9ef;
    font: 16px system-ui;
  }
  canvas {
    image-rendering: pixelated;
    border: 1px solid #65708a;
  }
  pre {
    white-space: pre-wrap;
  }
</style>
<h1>WASM ANSI-16 renderer test</h1>
<canvas id="result"></canvas>
<pre id="status">Loading renderer…</pre>
<script type="module">
  import ClientModuleFactory from "/wasm/client.js";

  const status = document.querySelector("#status");
  try {
    const module = await ClientModuleFactory({
      locateFile: (name) => `/wasm/${name}`,
    });
    const renderer = new module.AsciiRendererBinding(18, 1, 12, false, 0);
    if (!renderer.valid())
      throw new Error(`renderer create failed: ${renderer.error()}`);
    const frame = "\x1b[31mRED   \x1b[32mGREEN   \x1b[34mBLUE";
    const { width, height } = renderer.dimensions();
    const pixels = renderer.render(frame, 0);
    if (!pixels) throw new Error("renderer render failed");
    const canvas = document.querySelector("#result");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.putImageData(new ImageData(pixels, width, height), 0, 0);
    const counts = { red: 0, green: 0, blue: 0 };
    for (let i = 0; i < pixels.length; i += 4) {
      const [r, g, b] = pixels.subarray(i, i + 3);
      if (r > 180 && g < 100 && b < 100) counts.red++;
      if (g > 180 && r < 100 && b < 100) counts.green++;
      if (b > 180 && r < 100 && g < 100) counts.blue++;
    }
    // A warm cell cache must produce exactly the same pixels as a fresh one,
    // including after eviction, background changes and overhanging glyphs.
    const sampleFrames = [
      "\x1b[0m\x1b[31mRED   \x1b[32mGREEN   \x1b[34mBLUE",
      "\x1b[0m\x1b[47;30m @gj_  \x1b[44;97mWMM \x1b[0m",
      "\x1b[0m\x1b[38;2;91;172;253m@@@@@@@@@@@@@@@@@@",
      "\x1b[0m\x1b[48;2;17;33;49m                  ",
    ];
    const renderPixels = (target, text) => {
      const pixels = target.render(text, 0);
      if (!pixels) throw new Error("cell cache render failed");
      return new Uint8ClampedArray(pixels);
    };
    let comparisons = 0;
    for (const text of sampleFrames) {
      const fresh = new module.AsciiRendererBinding(18, 1, 12, false, 0);
      if (!fresh.valid()) throw new Error("create failed");
      let expected;
      try {
        expected = renderPixels(fresh, text);
      } finally {
        fresh.delete();
      }
      for (let pass = 0; pass < 2; pass++) {
        const actual = renderPixels(renderer, text);
        if (!actual.every((value, index) => value === expected[index]))
          throw new Error("warm/cold renderer pixel mismatch");
        comparisons++;
      }
    }
    status.textContent = JSON.stringify(
      { width, height, counts, comparisons, result: "PASS" },
      null,
      2,
    );
    renderer.delete();
  } catch (error) {
    status.textContent = String(error?.stack || error);
  }
</script>
