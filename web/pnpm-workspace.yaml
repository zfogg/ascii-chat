packages:
  - "packages/*"
  - "www"
  - "discovery"
  - "web"
# Vite+ resolves its tools from the workspace before its own dependencies.
# Expose its bundled versions so ancestor node_modules cannot shadow them.
publicHoistPattern:
  - "oxfmt"
  - "oxlint"
  - "oxlint-tsgolint"
allowBuilds:
  core-js: true
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
