# ascii-chat dependency build manifest.
#
# The module named in `cmake/deps/Dependencies.cmake` owns the target contract;
# this file records the cache/build boundary so a dependency cannot silently
# fall back to a second FetchContent tree.

dependencies:
  libplatform:
    source: deps/ascii-chat-deps/libplatform
    version: submodule
    cache: "${ASCIICHAT_DEPS_CACHE_DIR}/libplatform"
    target: asciichat-libplatform
    role: target
  libflags:
    source: deps/ascii-chat-deps/libflags
    version: submodule
    cache: "${ASCIICHAT_DEPS_CACHE_DIR}/libflags"
    target: asciichat-libflags
    role: target
  gotel:
    source: deps/ascii-chat-deps/gotel
    version: submodule
    cache: "${ASCIICHAT_DEPS_CACHE_DIR}/gotel"
    target: asciichat-gotel
    role: target
  recast:
    source: deps/recast
    version: submodule
    cache: "${ASCIICHAT_DEPS_CACHE_DIR}/host-tools/recast-llvm23"
    target: recast-native
    role: host
  icu:
    source: external
    version: module-defined
    cache: "${ASCIICHAT_DEPS_CACHE_DIR}/build/icu"
    target: asciichat-icu
    role: target
  ffmpeg:
    source: external
    version: module-defined
    cache: "${ASCIICHAT_DEPS_CACHE_DIR}/build/installed/ffmpeg"
    target: asciichat-ffmpeg
    role: target
  zstd:
    source: system-or-cache
    version: module-defined
    cache: "${ASCIICHAT_DEPS_CACHE_DIR}/zstd"
    target: asciichat-zstd
    role: target
  libsodium:
