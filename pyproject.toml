[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "dotenv>=0.9.9",
  "gcovr>=8.8",
  "neovim>=0.3.1",
  "nltk>=3.8",
  "pip>=26.0.1",
  "pygments-base16>=1.0.3",
  "pytest>=9,<10",
  "pytest-xdist>=3.8,<4",
  "psutil>=6",
  "filelock>=3.16",
  "fonttools>=4.60,<5",
  "numpy>=1.26,<3",
  "pyte==0.8.2",
  "pywinpty; sys_platform == 'win32'",
  "Pillow>=12,<13",
  "wcwidth",
  "ruff>=0.14,<1",
  "ty>=0.0.99,<0.1",
  "pexpect==4.9.0",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
audio = ["scipy", "matplotlib", "sounddevice", "soundfile"]
telemetry = [
  "gotel @ git+https://github.com/zfogg/gotel.git@v0.14.0#subdirectory=python",
]

[tool.setuptools]
packages = ["ascii_chat_tests"]
package-dir = { ascii_chat_tests = "tests/python/ascii_chat_tests" }

[tool.pytest.ini_options]
testpaths = ["tests/python/tests"]
addopts = [
  "--strict-markers",
  "--import-mode=importlib",
  "-n",
  "logical",
  "--dist",
  "loadgroup",
]
markers = [
  "unit: fast isolated Python tests",
  "integration: tests exercising native executables",
  "cli: native command-line contracts",
  "network: loopback networking tests",
  "native: native library checks requiring isolated interpreters",
  "media: media processing tests",
  "performance: performance and frame-rate regression tests",
  "terminal: PTY and terminal behavior",
  "hardware: requires exclusive access to physical audio or video devices",
  "xdist_group(name): schedule tests sharing an external resource in one xdist group",
  "mcp: MCP protocol tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Some legacy probes initialize their test environment before imports and use
# compact one-line statements; keep those conventions while checking errors.
ignore = ["E402", "E701", "E702"]

[tool.ty.environment]
python-platform = "all"
extra-paths = [
  "deps/ascii-chat-deps/gotel/c/testing/python",
  "deps/ascii-chat-deps/gotel/python/src",
]

[tool.ty.rules]
# Optional platform and audio imports resolve only on hosts with those extras.
unused-ignore-comment = "ignore"
