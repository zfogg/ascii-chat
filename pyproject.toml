[project]
name = "default"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dotenv>=0.9.9",
  "neovim>=0.3.1",
  "nltk>=3.8",
  "pip>=26.0.1",
  "pygments-base16>=1.0.3",
  "pygobject>=3.54.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["--strict-markers", "-n", "logical"]
markers = [
  "unit: fast isolated Python tests",
  "integration: tests exercising native executables",
  "cli: native command-line contracts",
  "network: loopback networking tests",
  "media: media processing tests",
  "terminal: PTY and terminal behavior",
  "mcp: MCP protocol tests",
]
